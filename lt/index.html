// Pure recognizer math for the Little Troubles scanner. No DOM, no fetch — so it
// runs in Node (build + tests) AND is injected verbatim into the mobile template.
// dHash grid is (CELL_W+1) x CELL_H grayscale => CELL_W*CELL_H comparison bits.
const CELL_W = 8;   // comparison columns (grid is 9 wide)
const CELL_H = 8;

// dHash from a grayscale array of size (CELL_W+1)*CELL_H, row-major.
// bit index = r*CELL_W + c ; bit set when gray[r][c] > gray[r][c+1].
function dhashFromGray(gray, w, h) {
  let hash = 0n;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w - 1; c++) {
      const i = r * w + c;
      if (gray[i] > gray[i + 1]) hash |= 1n << BigInt(r * (w - 1) + c);
    }
  }
  return hash;
}

// Banner mask: physical cards lack the wiki's top-left diagonal ribbon, so we
// drop bits whose cell center lies in the top-left triangle
// (0,0)->(0.38W,0)->(0,0.26H): x/0.38 + y/0.26 <= 1.
function _computeMaskedBits() {
  const s = new Set();
  for (let r = 0; r < CELL_H; r++) {
    for (let c = 0; c < CELL_W; c++) {
      const x = (c + 0.5) / CELL_W, y = (r + 0.5) / CELL_H;
      if (x / 0.38 + y / 0.26 <= 1) s.add(r * CELL_W + c);
    }
  }
  return s;
}
const MASKED_BITS = _computeMaskedBits();
const _MASK = (() => { let m = 0n; for (const b of MASKED_BITS) m |= 1n << BigInt(b); return ~m; })();

function firstFreeBit() { for (let b = 0; b < CELL_W * CELL_H; b++) if (!MASKED_BITS.has(b)) return b; return -1; }
function firstMaskedBit() { return MASKED_BITS.values().next().value; }

// Hamming distance over non-masked bits only.
function maskedHamming(a, b) {
  let x = (a ^ b) & _MASK, n = 0;
  while (x > 0n) { n += Number(x & 1n); x >>= 1n; }
  return n;
}

// Nearest entry in the reference table. Returns {best, second} each {id, face, distance}.
function nearestMatch(hash, table) {
  let best = null, second = null;
  for (const e of table) {
    const d = maskedHamming(hash, e.hash);
    const hit = { id: e.id, face: e.face, distance: d };
    if (!best || d < best.distance) { second = best; best = hit; }
    else if (!second || d < second.distance) second = hit;
  }
  return { best, second };
}

// Normalize a card name for matching: lowercase, drop the dual-face " // " tail,
// strip surrounding quotes and punctuation, collapse whitespace.
// Assumption: catalog names use " // " exclusively as the dual-face separator
// (not as literal card-name punctuation). Stripping all punctuation will not
// cause false collisions within the current 558-card LT pool because no two
// cards are punctuation-distinct on the same normalized token sequence.
function normalizeName(name) {
  if (!name) return '';
  let s = String(name).split('//')[0];           // front face only
  s = s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}

// Resolve a read (name + optional collector number/total) to one catalog card.
// Name is primary; number/total disambiguates same-name reprints across sets.
function resolveByNameNumber(name, number, total, catalog) {
  const want = normalizeName(name);
  if (!want) return null;
  const matches = catalog.filter(c => normalizeName(c.name) === want);
  if (matches.length === 0) return null;
  if (matches.length === 1) return matches[0];
  if (number != null) {
    const byNum = matches.filter(c => Number(c.number) === Number(number) &&
      (total == null || Number(c.setSize) === Number(total)));
    if (byNum.length === 1) return byNum[0];
    if (byNum.length === 0) return null;   // number given but matched nothing → don't guess; let the review UI handle it
    // byNum.length > 1 → fall through to first-match
  }
  return matches[0]; // best effort when no number to disambiguate; review UI lets the user correct
}

// True if a proposed new-deck name collides with an existing deck (case-insensitive).
function deckNameCollision(name, decks) {
  const n = String(name || '').trim().toLowerCase();
  return (decks || []).some(d => String(d.name || '').trim().toLowerCase() === n);
}

// ── Standalone Little Troubles app: merging a save from two devices ─────────────
// The app keeps its collection and decks in one file. Before saving, a device fetches the file
// again and applies only what IT changed since it last synced (local minus base) on top of what
// is there now (remote), so a card scanned on the phone is not lost to an edit made on the PC.
// Quantities: remote + (local - base), never below zero; a card at zero is dropped.
function mergeQty(remote, base, local) {
  const out = {};
  for (const id of new Set([...Object.keys(remote || {}), ...Object.keys(base || {}), ...Object.keys(local || {})])) {
    const q = ((remote || {})[id] || 0) + (((local || {})[id] || 0) - ((base || {})[id] || 0));

  if (q) cards = ltCat().cards.filter(c => _ltMatch(c.name + ' ' + (c.text || ''), q));
  else cards = ltCat().cards.filter(c => ltOwnedMode(c.id) > 0);
  const rows = cards.slice(0, 150).map(c => {
    const qty = ltOwnedMode(c.id);
    return `<div class="lt-row">

}

// Reattach an already-running stream across re-renders. The camera is started
// explicitly via ltStartCamera() (a direct tap) — iOS standalone PWAs often block
// an auto-started camera but allow one initiated by a user gesture.
function ltScanMount() {
  if (!_ltStream) return;
  const v = document.getElementById('lt-cam'); if (v) v.srcObject = _ltStream;
}

// Start the live camera on an explicit user tap; surface the real reason on failure.
async function ltStartCamera() {
  const status = document.getElementById('lt-scan-status');
  const startBtn = document.getElementById('lt-cam-start');
  if (status) status.textContent = 'Starting camera…';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('getUserMedia unavailable');
    _ltStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('lt-cam'); if (v) v.srcObject = _ltStream;
    if (startBtn) startBtn.hidden = true;
    const sh = document.getElementById('lt-shutter'); if (sh) sh.disabled = false;
    if (status) status.textContent = '';
  } catch (e) {
    console.warn('LT camera unavailable:', e);
    const reason = (e && e.name && e.name !== 'Error') ? e.name : (e && e.message ? e.message : 'error');
    if (status) status.textContent = 'Camera blocked (' + reason + ') — iOS may not allow live camera in a home-screen app. Use Photo, or open the site in Safari.';
    if (startBtn) startBtn.textContent = 'Tap to retry camera';
  }
}
function ltScanUnmount() {
  if (_ltStream) { _ltStream.getTracks().forEach(t => t.stop()); _ltStream = null; }
}

function ltBatchHtml() {

const LT_PHASH_ACCEPT = 14;   // <= this masked-Hamming distance => high confidence (tune w/ real cards)
const LT_PHASH_MARGIN = 4;    // best must beat 2nd by this much to auto-accept

// Draw a source (video or image) cropped to the guide frame; return {gray,gw,gh,thumbDataUrl,fullDataUrl}.
function ltFrameData(source, sw, sh) {
  const cardRatio = LT_GUIDE_RATIO;
  let cw = sw, ch = sh;
  if (sw / sh > cardRatio) cw = sh * cardRatio; else ch = sw / cardRatio;
  const cx = (sw - cw) / 2, cy = (sh - ch) / 2;
  const gw = CELL_W + 1, gh = CELL_H;
  // Supersample the crop, then box-average down to the gw x gh grid — mirrors
  // build-lt-hashes.mjs toGray() so runtime hashes match the reference table
  // (the browser's drawImage-to-tiny downscale would diverge from the build).
  const SS = 16, iw = gw * SS, ih = gh * SS;
  const sc = document.createElement('canvas'); sc.width = iw; sc.height = ih;
  const sctx = sc.getContext('2d'); sctx.drawImage(source, cx, cy, cw, ch, 0, 0, iw, ih);
  const px = sctx.getImageData(0, 0, iw, ih).data;
  const gray = new Uint8Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    let sum = 0, n = 0;
    for (let y = gy * SS; y < (gy + 1) * SS; y++) for (let x = gx * SS; x < (gx + 1) * SS; x++) {
      const o = (y * iw + x) * 4; sum += 0.299 * px[o] + 0.587 * px[o + 1] + 0.114 * px[o + 2]; n++;
    }
    gray[gy * gw + gx] = Math.round(sum / n);
  }
  const tc = document.createElement('canvas'); tc.width = 240; tc.height = Math.round(240 / cardRatio);
  tc.getContext('2d').drawImage(source, cx, cy, cw, ch, 0, 0, tc.width, tc.height);
  const fw = Math.min(Math.round(cw), 640);
  const fc = document.createElement('canvas'); fc.width = fw; fc.height = Math.round(fw / cardRatio);
  fc.getContext('2d').drawImage(source, cx, cy, cw, ch, 0, 0, fc.width, fc.height);
  return { gray, gw, gh, thumbDataUrl: tc.toDataURL('image/jpeg', 0.6), fullDataUrl: fc.toDataURL('image/jpeg', 0.85) };
}

// Resolve one captured frame to a batch entry (pHash first, AI fallback).
async function ltResolveFrame(fd) {
  const hash = dhashFromGray(fd.gray, fd.gw, fd.gh);
  const table = ltHashTable();
  const { best, second } = nearestMatch(hash, table);
  const confident = best && best.distance <= LT_PHASH_ACCEPT &&
    (!second || second.distance - best.distance >= LT_PHASH_MARGIN);
  if (confident && ltQuickMode) {
    return { cardId: best.id, name: ltCardById(best.id)?.name, source: 'pHash', confidence: best.distance, thumb: fd.thumbDataUrl };
  }
  let aiErr = null;
  const ai = await ltAiRead(fd.fullDataUrl).catch(e => { aiErr = e; console.warn('LT AI read failed:', e); return null; });
  if (ai) {
    const card = resolveByNameNumber(ai.name, ai.number, ai.total, DATA.lt.catalog.cards);
    if (card) return { cardId: card.id, name: card.name, source: 'AI', confidence: 0, thumb: fd.thumbDataUrl };
  }
  if (best) return { cardId: best.id, name: ltCardById(best.id)?.name, source: confident ? 'pHash' : 'unresolved', confidence: best.distance, thumb: fd.thumbDataUrl, aiError: aiErr ? (aiErr.message || 'AI error') : null };
  return { cardId: null, name: null, source: 'unresolved', confidence: null, thumb: fd.thumbDataUrl, aiError: aiErr ? (aiErr.message || 'AI error') : null };
}

// Read the printed name + collector number off a card photo. Returns {name,number,total,rarity} or throws.
async function ltAiRead(dataUrl) {
  const key = DATA.scan?.key; if (!key) throw new Error('no scan key configured');
  const b64 = dataUrl.split(',')[1];
  const body = {
    model: 'claude-haiku-4-5',
    max_tokens: 200,
    messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } },
      { type: 'text', text: 'This is a "Little Troubles" trading card. It may be full-art, landscape, or rotated/sideways, and the layout varies. Read ONLY what is actually printed on it, in any orientation or position. Return the card title/name, the collector number and its set total (often shown as "N/total"), and the single rarity letter if visible. The name and number can appear anywhere on the card. If a value is not legible, use null.' },
    ]}],
    output_config: { format: { type: 'json_schema', schema: {
      type: 'object', additionalProperties: false,
      properties: { name: { type: ['string','null'] }, number: { type: ['integer','null'] }, total: { type: ['integer','null'] }, rarity: { type: ['string','null'] } },
      required: ['name','number','total','rarity'],
    }}},
  };
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error('AI ' + res.status);
  const data = await res.json();
  const txt = (data.content || []).find(b => b.type === 'text')?.text || '{}';
  return JSON.parse(txt);
}

async function ltCapture() {
  const v = document.getElementById('lt-cam');
  if (!v || !v.videoWidth) { const st = document.getElementById('lt-scan-status'); if (st) st.textContent = 'Camera not ready.'; return; }
  await ltAddFrame(ltFrameData(v, v.videoWidth, v.videoHeight));
}
async function ltCaptureFile(input) {
  const file = input.files && input.files[0]; if (!file) return;
  const img = new Image();
  img.onload = async () => { await ltAddFrame(ltFrameData(img, img.naturalWidth, img.naturalHeight)); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(file); input.value = '';
}
async function ltAddFrame(fd) {
  const status = document.getElementById('lt-scan-status');
  if (status) status.textContent = 'Identifying…';
  const entry = await ltResolveFrame(fd);
  ltScanBatch.push(entry);
  if (status) status.textContent = entry.cardId
    ? `Added: ${entry.name}${entry.source === 'AI' ? ' (read)' : entry.source === 'pHash' ? ' (match)' : ' — review'}`
    : (entry.aiError ? `AI read failed (${entry.aiError}) — saved for review` : 'Unresolved — review later');
  renderLT();
}

function ltScanReview() {
  if (!ltScanBatch.length) return;

  const bodyHtml = `<div class="lt-review">

      <button class="lt-commit" onclick="ltCommitNewDeck()">Save as New Deck…</button>

function ltFixRow(i) {
  const pick = prompt('Type the correct card name (exact or partial):');
  if (!pick) return;
  const want = pick.trim().toLowerCase();
  const c = DATA.lt.catalog.cards.find(x => x.name.toLowerCase() === want)
    || DATA.lt.catalog.cards.find(x => x.name.toLowerCase().includes(want));
  if (!c) { alert('No card matches that name.'); return; }
  ltScanBatch[i] = { ...ltScanBatch[i], cardId: c.id, name: c.name, source: 'manual' };
  ltScanReview();
}

function ltBatchCounts() {
  const counts = {};
  for (const b of ltScanBatch) if (b.cardId) counts[b.cardId] = (counts[b.cardId] || 0) + 1;
  return counts;
}

function ltCommitCollection() {
  const counts = ltBatchCounts();
  if (!Object.keys(counts).length) { alert('Nothing resolved to add.'); return; }
  const resolved = Object.values(counts).reduce((a, b) => a + b, 0);
  const unresolved = ltScanBatch.length - resolved;
  if (unresolved > 0 && !confirm(`${unresolved} card(s) are still unresolved and will be skipped. Continue?`)) return;
  const phys = DATA.lt.collection.physical;
  for (const [id, n] of Object.entries(counts)) phys[id] = (phys[id] || 0) + n;
  ltQueueColl(); ltPersistColl();
  ltScanBatch = []; closeSheet(); renderLT();
}

function ltCommitNewDeck() {
  const counts = ltBatchCounts();
  if (!Object.keys(counts).length) { alert('Nothing resolved to add.'); return; }
  const resolved = Object.values(counts).reduce((a, b) => a + b, 0);
  const unresolved = ltScanBatch.length - resolved;
  if (unresolved > 0 && !confirm(`${unresolved} card(s) are still unresolved and will be skipped. Continue?`)) return;
  let name = (prompt('New deck name:') || '').trim();
  if (!name) return;
  if (deckNameCollision(name, DATA.lt.decks)) {
    if (!confirm(`A deck named "${name}" already exists. Overwrite it?`)) return;
  }
  let deck = DATA.lt.decks.find(d => d.name.toLowerCase() === name.toLowerCase());
  if (!deck) { deck = { name, cards: {}, notes: '', banner: null }; DATA.lt.decks.push(deck); }
  deck.cards = { ...counts };
  ltQueueDeck(deck);
  ltScanBatch = []; closeSheet(); renderLT();
}

// ── Standalone Little Troubles app (DATA.ltOnly) ───────────────────────────────────────────────
// One page for phone and PC. The collection and decks live in ONE encrypted file in the app's own
// repo (DATA.gh.statePath), read and written through the GitHub API with the token in the unlocked
// payload. No PC step and no export: a change is saved a moment after it is made. Offline, changes
// stay in this browser and are saved when the connection is back. Two devices are merged by
// mergeLtState (scripts/lt-scan-core.mjs): each device applies only what it changed.
const LTA_KEY = 'lta_state_v1';   // { base, local }: base = the file as this device last saw it
let _ltaBase = null, _ltaTimer = null, _ltaSaving = false, _ltaAgain = false, _ltaMsg = '';
const _ltaSnap = () => JSON.parse(JSON.stringify({ collection: DATA.lt.collection, decks: DATA.lt.decks }));
const _ltaDirty = () => JSON.stringify(mergeLtState(_ltaSnap(), null, null)) !== JSON.stringify(mergeLtState(_ltaBase, null, null));
function ltaStatus(msg) {
  if (msg !== undefined) _ltaMsg = msg;
  const el = document.getElementById('meta'); if (el) el.textContent = _ltaMsg;
}
function _ltaUrl() { const gh = DATA.gh; return `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${gh.statePath}`; }
function _ltaHeaders() { return { Authorization: `Bearer ${DATA.gh.token}`, Accept: 'application/vnd.github+json' }; }
// The file as it is on GitHub now: { state, sha }, or { state: null } when it does not exist yet.
async function _ltaFetch() {
  const r = await fetch(`${_ltaUrl()}?ref=${DATA.gh.branch}&t=${Date.now()}`, { headers: _ltaHeaders(), cache: 'no-store' });
  if (r.status === 404) return { state: null, sha: undefined };
  if (!r.ok) throw new Error('GitHub answered ' + r.status);
  const j = await r.json();
  const file = JSON.parse(decodeURIComponent(escape(atob(String(j.content || '').replace(/\s/g, '')))));
  return { state: await decryptJson(file.enc, _pass), sha: j.sha };
}
function _ltaApply(state) { DATA.lt.collection = state.collection; DATA.lt.decks = state.decks; }
function _ltaStore() { try { localStorage.setItem(LTA_KEY, JSON.stringify({ base: _ltaBase, local: _ltaSnap() })); } catch { /* storage full: the next online save still holds the data */ } }
// At unlock: show what this browser last had, then bring in the file and merge. Never throws.
async function ltaInit() {
  let cached = null; try { cached = JSON.parse(localStorage.getItem(LTA_KEY) || 'null'); } catch { cached = null; }
  if (cached && cached.local) { _ltaBase = cached.base || null; _ltaApply(mergeLtState(cached.local, null, null)); }
  if (!DATA.gh || !DATA.gh.token || !DATA.gh.statePath) { ltaStatus('This copy has no save location set up; changes stay in this browser.'); return; }
  try {
    const { state } = await _ltaFetch();
    const opened = ltOpenState(state, _ltaBase, cached && cached.local ? _ltaSnap() : null);
    _ltaBase = opened.base;
    _ltaApply(opened.state); _ltaStore();
    if (_ltaDirty()) { ltaStatus('Saving…'); ltaSave(); } else ltaStatus('Saved · up to date');
  } catch (e) {
    ltaStatus(cached ? 'Offline: showing what this device last had. Changes will be saved when you are back online.' : 'Could not load your collection (' + e.message + ').');
  }
}
// Called after every change to the collection or a deck.
function ltaChanged() {
  _ltaStore();
  ltaStatus('Saving…');
  clearTimeout(_ltaTimer); _ltaTimer = setTimeout(ltaSave, 900);
}
async function ltaSave() {
  if (!DATA.gh || !DATA.gh.token || !DATA.gh.statePath) return;
  if (_ltaSaving) { _ltaAgain = true; return; }
  _ltaSaving = true;
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const { state, sha } = await _ltaFetch();
      const mine = _ltaSnap();   // what this device has as the save starts
      const merged = mergeLtState(state, _ltaBase, mine);
      const content = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, savedAt: new Date().toISOString(), enc: await encryptJson(merged, _pass) }))));
      const put = await fetch(_ltaUrl(), { method: 'PUT', headers: _ltaHeaders(), body: JSON.stringify({ message: 'little troubles: save', content, branch: DATA.gh.branch, ...(sha ? { sha } : {}) }) });
      if (put.status === 409 || put.status === 422) continue;   // the file changed while we were merging: fetch again
      if (!put.ok) throw new Error('GitHub answered ' + put.status);
      // What changed on this device while the save was in flight stays local and is saved next.
      const sent = merged;
      _ltaBase = mergeLtState(sent, null, null);
      _ltaApply(mergeLtState(sent, mine, _ltaSnap()));   // the saved file, plus anything changed here since the save started
      _ltaStore();
      ltaStatus(_ltaDirty() ? 'Saving…' : 'Saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
      if (_ltaDirty()) _ltaAgain = true;
      if (activeTab === 'lt' && ltView !== 'scan') renderLT();
      return;
    }
    throw new Error('the file kept changing; will try again');
  } catch (e) {
    ltaStatus((navigator.onLine === false ? 'Offline' : 'Not saved yet (' + e.message + ')') + ': your changes are kept on this device and will be saved when possible.');
  } finally {
    _ltaSaving = false;
    if (_ltaAgain) { _ltaAgain = false; clearTimeout(_ltaTimer); _ltaTimer = setTimeout(ltaSave, 900); }
  }
}
window.addEventListener('online', () => { if (DATA && DATA.ltOnly && _ltaDirty()) ltaSave(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DATA && DATA.ltOnly && !_ltaSaving) ltaInit().then(() => { if (activeTab === 'lt' && ltView !== 'scan') renderLT(); }); });

// Deck editing (standalone app).
function ltaNewDeck() {

  if (!name) return;

  DATA.lt.decks.push({ name, cards: {}, notes: '', banner: null });

let _ltaAddDeck = -1;
function ltaAddCards(i) {

  openSheet(d.name, 'var(--lt)', `<input class="search" id="lta-add-q" type="search" placeholder="Type a card name…" oninput="ltaAddResults(this.value)" autocomplete="off"><div id="lta-add-list"></div>`, 'Add cards');

function ltaAddResults(query) {
  const el = document.getElementById('lta-add-list'), d = DATA.lt.decks[_ltaAddDeck];
  if (!el || !d) return;
  const want = String(query || '').trim().toLowerCase();
  if (want.length < 2) { el.innerHTML = '<div class="empty">Type at least 2 letters. Cards you own are listed first.</div>'; return; }
  const hits = ltCat().cards.filter(c => c.name.toLowerCase().includes(want))
    .sort((a, b) => (ltOwned(b.id) > 0) - (ltOwned(a.id) > 0) || a.name.localeCompare(b.name)).slice(0, 40);
  el.innerHTML = hits.length ? hits.map(c => `<div class="lt-row">
      <button class="lt-step" onclick="ltaAddOne('${c.id}', -1)">−</button><span class="lt-q">${d.cards[c.id] || 0}</span><button class="lt-step" onclick="ltaAddOne('${c.id}', 1)">+</button>
      <span class="cname" data-lt-card="${c.id}">${esc(c.name)}${c.restricted ? ' <span class="lt-1">•1</span>' : ''}</span><span class="lt-own">own ${ltOwned(c.id)}</span></div>`).join('')
    : '<div class="empty">No card matches.</div>';
}
function ltaAddOne(id, delta) {
  const d = DATA.lt.decks[_ltaAddDeck]; if (!d) return;
  const q = Math.max(0, (d.cards[id] || 0) + delta);
  if (q) d.cards[id] = q; else delete d.cards[id];
  ltaChanged();
  ltaAddResults(document.getElementById('lta-add-q')?.value || '');
  renderLT();
}

// ── Edit sync (phone → desktop) via the GitHub inbox, mirroring the swap-decision transport ──
const LTQ_KEY = 'dv_lt_decks';
function ltqLoad() { try { return JSON.parse(localStorage.getItem(LTQ_KEY) || '{}'); } catch { return {}; } }
function ltqSave(q) { localStorage.setItem(LTQ_KEY, JSON.stringify(q)); }
function ltQueueDeck(d) { if (DATA.ltOnly) return ltaChanged(); const q = ltqLoad(); q['deck:' + d.name] = { kind: 'deck', name: d.name, cards: d.cards, ts: Date.now(), synced: false }; ltqSave(q); pushLT().catch(() => {}); }
function ltQueueColl() { if (DATA.ltOnly) return ltaChanged(); const q = ltqLoad(); q['collection'] = { kind: 'collection', collection: DATA.lt.collection, ts: Date.now(), synced: false }; ltqSave(q); pushLT().catch(() => {}); }
let _ltPushing = false, _ltAgain = false;
async function pushLT() {
  const gh = DATA.gh; if (!gh || !gh.token) return;
  if (_ltPushing) { _ltAgain = true; return; }
  _ltPushing = true;
  try {
    const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/inbox/lt-edits.json`;
    const headers = { Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' };
    let sha;
    try { const r = await fetch(`${url}?ref=${gh.branch}&t=${Date.now()}`, { headers, cache: 'no-store' }); if (r.ok) sha = (await r.json()).sha; } catch {}
    const edits = Object.values(ltqLoad());
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, edits }, null, 2))));
    const body = { message: `phone LT edits (${edits.length})`, content, branch: gh.branch, ...(sha ? { sha } : {}) };
    const put = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!put.ok) throw new Error('lt write failed: ' + put.status);
    const nq = ltqLoad(); for (const k of Object.keys(nq)) nq[k].synced = true; ltqSave(nq);
  } finally { _ltPushing = false; if (_ltAgain) { _ltAgain = false; pushLT().catch(() => {}); } }
}
function flushLT() { if (DATA.ltOnly) return; if (Object.values(ltqLoad()).some(e => !e.synced)) pushLT().catch(() => {}); }

// ── Durable collection state across reloads (iOS evicts standalone PWAs mid-session) ──
// Keyed to the export's `generated` watermark: scanned additions survive reloads of the
// SAME export, and reset when a newer export arrives (those additions are already
// incorporated server-side after a desktop sync + re-export). Without this, a reload
// reset DATA.lt.collection to the exported baseline and the next commit's snapshot
// overwrote earlier batches — dropping cards when you didn't sync between rounds.
const LTC_KEY = 'dv_lt_coll';
function ltPersistColl() {
  if (DATA.ltOnly) return;   // the standalone app keeps its own local copy (ltaChanged)
  try { localStorage.setItem(LTC_KEY, JSON.stringify({ basedOn: DATA && DATA.generated, collection: DATA.lt.collection })); } catch {}
}
function ltReconcileLocal() {
  if (!DATA || !DATA.lt || DATA.ltOnly) return;
  let p = null; try { p = JSON.parse(localStorage.getItem(LTC_KEY) || 'null'); } catch {}
  if (p && p.basedOn === DATA.generated && p.collection) {
    DATA.lt.collection = p.collection;            // restore in-memory additions across a reload
  } else {
    localStorage.removeItem(LTC_KEY);             // newer export → drop superseded local state
    try { const q = ltqLoad(); delete q['collection']; ltqSave(q); } catch {}
  }
}

// LT card image popup — shows the catalog art; BOTH faces for dual-sided cards.
function ltShowCard(id) {
  const c = ltCardById(id); if (!c || !c.image) return;
  const pop = document.getElementById('cardpop'), img = document.getElementById('cardpop-img');
  const msg = document.getElementById('cardpop-msg'), cap = document.getElementById('cardpop-cap');
  cap.textContent = c.name; msg.style.display = 'none';
  let dc = document.getElementById('cardpop-dual');
  if (!dc) { dc = document.createElement('div'); dc.id = 'cardpop-dual'; dc.style.cssText = 'display:none;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;'; img.parentNode.insertBefore(dc, img); }
  const dual = c.faces && c.faces.length === 2 && c.faces[0].image && c.faces[1].image;
  if (dual) {
    img.style.display = 'none'; dc.style.display = 'flex';
    dc.innerHTML = c.faces.map(f => `<img src="${esc(f.image)}" style="max-width:46%;border-radius:9px;">`).join('');
  } else {
    dc.style.display = 'none'; img.style.display = 'block'; img.src = c.image;
  }
  pop.style.display = 'flex';
}

// ── Boot ──
document.getElementById('gate-label').textContent = LABEL;
const saved = localStorage.getItem('dv_pass');
if (saved && ENC) tryDecrypt(saved).then(async d => { DATA = d; _pass = saved; if (DATA.ltOnly) await ltaInit(); ltReconcileLocal(); show(); flushDecisions(); flushLT(); flushPrintings(); }).catch(() => localStorage.removeItem('dv_pass'));
</script>
