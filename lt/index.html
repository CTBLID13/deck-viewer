<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8eaee">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Decks">
<title>Little Troubles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<!-- Card-type icons (mana-font, by Andrew Gioia): decoration only; offline the headings simply have no icon. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css">
<style>
  :root {
    /* Clean theme (2026-10-04): light gray page, white bordered cards, one plain font, colour only for
       the game, status and the active item. Same tokens and values as the desktop (index.html). */
    --bg:#e8eaee; --bg2:#f6f7f9; --surface:#ffffff; --surface2:#f6f7f9; --surface3:#eceef2;
    --border:#9ea3ad; --border2:#c5c9d0;
    --text:#0d0e11; --text2:#24272e; --text3:#454a55;
    --chassis:#e8eaee; --bezel:#22252b;
    --mtg:#c4561c; --mtg-dim:#e6b393;
    --ygo:#6d42c6; --ygo-dim:#bba5e6; --ygo-gold:#8f6a0c;
    --lt:#2a8db2; --lt-dim:#9fcfe0;
    --warn:#9a6208; --err:#c0392b; --danger:#c0392b; --accent:#2c64b8; --ygo-bg:#e8eaee;
    --shadow:0 6px 20px color-mix(in srgb, #16181d 14%, transparent);
    --ok: #2e7d4f; --ok-text: #24683f; --ok-bg: #e3f1e7;
    --warn-text: #8a5606; --warn-bg: #fbf0d9;
    --danger-text: #a33124; --danger-bg: #fbe4e0;
    --info: #2c64b8; --info-strong: #1f4f8a;
    --indigo: #4a52c4; --violet: #6d4bc0; --teal: #1f7f76; --cyan: #1c8aa1; --orange: #c2641e; --gold: #8f6a0c; --pink: #b8456f;
    --mtg-tint: #e8eaee; --ygo-tint: #e8eaee; --lt-tint: #e8eaee;
    --on-fill: #ffffff; --wash: #16181d; --shade: #16181d;
    --mtg-bright: #ff9a55; --ygo-bright: #c3a0ff; --lt-bright: #8fd3ec;
    --head-bg: #e9ecf0;
    --zebra: #eef1f5;
    --ink-outline: #1a1c21;
    --font-body:'Lato', system-ui, -apple-system, sans-serif;
    --font-display:'Lato', system-ui, -apple-system, sans-serif;
    --font-mono:ui-monospace, Menlo, monospace;
    --font-num:'Lato', system-ui, sans-serif;
    --fs-xs:12px; --fs-sm:13px; --fs-md:14px; --fs-base:15px;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; }
  body {
    background: var(--bg);                 /* flat base; per-game flat tint below */
    color:var(--text);
    font:16px/1.45 var(--font-body);
    padding:
      calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
      calc(28px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    max-width:600px; margin:0 auto; min-height:100vh;
  }
  @keyframes riseIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes sheetUp { from { transform:translateY(100%); } to { transform:none; } }

  /* ── Header ───────────────────────────── */
  .brand { display:flex; align-items:baseline; gap:8px; margin:6px 2px 4px; }
  .brand h1 { font-size:21px; letter-spacing:.5px; font-weight:800; }
  .brand h1 .g { color:var(--mtg); }
  /* "mobile" beside the wordmark: a small soft pill, not a boxed tag (Jake, 2026-10-05: the box looked sloppy) */
  .brand { align-items:center; }
  .brand-sub { font-size:12px; font-weight:700; color:var(--mtg); background:color-mix(in srgb, var(--mtg) 12%, var(--surface));
    padding:3px 9px; border-radius:999px; line-height:1.2; transform:translateY(1px); }
  .label { font-size:var(--fs-md); color:var(--text2); margin:0 2px 14px; }
  .accent-strip { height:3px; border-radius:3px; margin:4px 2px 12px;
    background:linear-gradient(90deg, var(--mtg) 0%, var(--mtg-dim) 28%, transparent 50%, var(--lt) 72%, var(--ygo) 100%); opacity:.85; }
  /* flat per-game background tints (match the desktop) */
  body[data-game="mtg"] { background:var(--mtg-tint); }
  body[data-game="ygo"] { background:var(--ygo-tint); }
  body[data-game="lt"]  { background:var(--lt-tint); }
  .tabs button.on.lt { color:var(--lt); }
  .findtabs button.on.lt { color:var(--lt); border-color:var(--lt); background:var(--surface2); }

  /* ── Gate ─────────────────────────────── */
  #gate { animation:riseIn .4s ease both; }
  #gate p { color:var(--text2); font-size:14px; margin:24px 2px 12px; }
  input[type=password] {
    width:100%; padding:14px; font-size:17px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
  }
  input[type=password]:focus { outline:none; border-color:var(--mtg); }
  .btn-primary {
    width:100%; margin-top:12px; padding:14px 16px; font-size:16px; font-weight:700;
    border-radius:12px; border:none; background:var(--mtg); color:var(--warn-bg);
    min-height:48px; cursor:pointer; transition:filter .15s;
  }
  .btn-primary:active { filter:brightness(.9); }
  label.remember { display:flex; gap:9px; align-items:center; font-size:14px; color:var(--text2); margin-top:16px; }
  label.remember input { width:20px; height:20px; accent-color:var(--mtg); }
  .err { color:var(--err); font-size:14px; margin-top:12px; min-height:18px; }

  /* ── Tabs (segmented) ─────────────────── */
  .tabs { display:flex; gap:4px; background:var(--bg2); border:1px solid var(--border2);
          border-radius:12px; padding:4px; margin:0 0 14px; position:sticky; top:6px; z-index:5;
}
  .tabs button {
    flex:1; min-height:44px; border:none; background:transparent; color:var(--text2);
    font-size:14px; font-weight:600; border-radius:9px; cursor:pointer; transition:all .15s;
  }
  .tabs button.on { background:var(--surface2); color:var(--text); box-shadow:var(--shadow); }
  .tabs button.on.mtg { color:var(--mtg); }
  .tabs button.on.ygo { color:var(--ygo); }
  .tabs button.on.arena { color:var(--info); }
  .actions button.ltb { border-color:var(--lt); color:var(--lt); }
  body[data-game="arena"] { background:color-mix(in srgb, var(--info) 7%, var(--bg)); }
  .deck.arena { border-left:3px solid color-mix(in srgb, var(--info) 75%, transparent); }
  .deck.arena .deck-head { background:none; }
  /* Magic art as decoration (2026-10-08): art thumbnails beside swap cards, type icons on group headings */
  .cthumb { width:34px; height:25px; object-fit:cover; object-position:50% 30%; vertical-align:middle; margin-right:6px; border:1px solid var(--ink-outline); border-radius:4px; background:var(--surface3); }
  .gtitle .ms { margin-right:6px; color:var(--text2); }
  .astatus { border:1px solid var(--ink-outline); border-radius:4px; padding:7px 10px; margin:0 0 8px; font-size:var(--fs-md); }
  .astatus.bad { background:var(--danger-bg); color:var(--danger-text); } .astatus.warn { background:var(--warn-bg); color:var(--warn-text); } .astatus.ok { background:var(--ok-bg); color:var(--ok-text); }
  .astatus div + div { margin-top:3px; }
  .aswap { padding:8px 0; border-bottom:1px solid var(--border); font-size:var(--fs-md); }
  .aswap .why { color:var(--text2); margin-top:4px; }
  .lvtag { font-size:var(--fs-xs); font-weight:700; padding:1px 6px; margin-left:6px; border:1px solid var(--ink-outline); border-radius:4px; background:var(--warn-bg); color:var(--warn-text); white-space:nowrap; }

  /* ── Deck cards ───────────────────────── */
  .deck { background:var(--surface); border:1px solid var(--border2); border-radius:14px;
          margin-bottom:10px; overflow:hidden; animation:riseIn .35s ease both; }
  .deck-head { display:flex; align-items:center; gap:10px; padding:14px 15px; cursor:pointer;
               min-height:56px; user-select:none; }
  .deck-head .info { flex:1; min-width:0; }
  .dname { font-weight:700; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dsub { font-size:var(--fs-md); color:var(--text2); margin-top:3px; }
  .pill { display:inline-block; font-size:var(--fs-xs); font-weight:700; padding:1px 7px; border-radius:20px;
          background:var(--bg2); border:1px solid var(--border); color:var(--text2); margin-left:2px; vertical-align:1px; }
  .chev { color:var(--text3); font-size:var(--fs-md); transition:transform .25s; flex-shrink:0; }
  .deck.open .chev { transform:rotate(90deg); }
  .deck-body { padding:0 15px 14px; }
  .deckart { aspect-ratio:3.6 / 1; overflow:hidden; position:relative; background:var(--bg2) no-repeat; }
  .deckart::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 0%, transparent) 45%, var(--surface) 100%); }
  .search { width:100%; padding:11px 13px; font-size:15px; border-radius:11px; border:1px solid var(--border);
            background:var(--surface); color:var(--text); margin-bottom:10px; -webkit-appearance:none; }
  .search:focus { outline:none; border-color:var(--mtg); }
  .sortrow { display:flex; align-items:center; gap:8px; margin:-2px 2px 12px; }
  .sortrow label { font-size:var(--fs-md); color:var(--text3); }
  .sortsel { flex:1; padding:9px 11px; font-size:14px; border-radius:9px; border:1px solid var(--border);
             background:var(--surface); color:var(--text); -webkit-appearance:none;
             background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
             background-position:calc(100% - 16px) center,calc(100% - 11px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  .sortsel:focus { outline:none; border-color:var(--mtg); }

  /* Find-a-card view */
  .findtabs { display:flex; gap:6px; margin-bottom:10px; }
  .findtabs button { flex:1; min-height:42px; border:1px solid var(--border2); background:var(--bg2);
    color:var(--text2); border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; }
  .findtabs button.on.mtg { color:var(--mtg); border-color:var(--mtg); background:var(--surface2); }
  .findtabs button.on.ygo { color:var(--ygo); border-color:var(--ygo); background:var(--surface2); }
  .findcard { background:var(--surface); border:1px solid var(--border2); border-radius:12px; padding:11px 13px; margin-bottom:8px; animation:riseIn .25s ease both; }
  .findname { font-size:15px; font-weight:700; cursor:pointer; }
  .findname .u { border-bottom:1px dotted var(--border); }
  .findmeta { font-size:var(--fs-sm); color:var(--text3); font-weight:400; margin-left:4px; }
  .findchips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .findchip { font-size:var(--fs-md); background:var(--bg2); border:1px solid var(--border); border-radius:8px;
    padding:5px 10px; cursor:pointer; color:var(--text2); min-height:30px; display:inline-flex; align-items:center; gap:5px; }
  .findchip b { color:var(--text); } .findchip i { color:var(--text3); font-style:normal; font-size:var(--fs-sm); }
  .deck.mtg { border-left:3px solid color-mix(in srgb, var(--gold) 75%, transparent); }
  .deck.mtg .deck-head { background:none; }
  .deck.ygo { border-left:3px solid color-mix(in srgb, var(--cyan) 65%, transparent); }
  .deck.ygo .deck-head { background:none; }
  .deck.dim { opacity:.72; }

  /* section headers (Meta / Off-Meta / Physical) */
  .section { display:flex; align-items:center; gap:9px; margin:20px 2px 10px; }
  .section .bar { width:4px; height:15px; border-radius:2px; }
  .section .lbl { font-size:var(--fs-md); font-weight:800; }
  .section .ct { font-size:var(--fs-sm); color:var(--text3); margin-left:auto; }

  /* MTG color-identity pips */
  .pips { display:inline-flex; gap:3px; margin-left:7px; vertical-align:-1px; }

  /* combo branch "view" button */
  .branch .torow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .viewbtn { border:1px solid var(--ygo-dim); background:color-mix(in srgb, var(--cyan) 10%, transparent); color:var(--ygo); font-size:var(--fs-sm);
             font-weight:600; padding:4px 10px; border-radius:8px; cursor:pointer; white-space:nowrap; min-height:30px; }
  .viewbtn:active { opacity:.55; }

  .actions { display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 12px; }
  .actions button { flex:1 1 96px; min-height:44px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; }
  .actions button.combos { border-color:var(--ygo-dim); color:var(--ygo); }
  .actions button.guide { border-color:var(--mtg-dim); color:var(--mtg); }
  .actions button.swaps { border-color:var(--mtg-dim); color:var(--mtg); }
  .actions button.manabox { border-color:var(--mtg-dim); color:var(--mtg); }

  .group { margin-top:12px; }
  .gtitle { font-size:var(--fs-sm); color:var(--text3);
            border-bottom:1px solid var(--border2); padding-bottom:4px; margin-bottom:6px; }
  .card { font-size:14px; padding:5px 0; display:flex; gap:8px; cursor:pointer; }
  .card:active { opacity:.55; }
  .card .cname { border-bottom:1px dotted var(--border); }
  .q { color:var(--text3); min-width:26px; font-variant-numeric:tabular-nums; }
  .empty { color:var(--text3); font-size:var(--fs-md); padding:8px 0; }
  .hint { font-size:var(--fs-md); color:var(--text3); margin:-4px 2px 12px; }

  /* card image popup */
  #cardpop { display:none; position:fixed; inset:0; z-index:70; background:color-mix(in srgb, var(--bg) 86%, transparent);
             align-items:center; justify-content:center; flex-direction:column; gap:14px;
             padding:24px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
             animation:riseIn .2s ease both;}
  #cardpop img { max-width:100%; max-height:74vh; border-radius:14px; box-shadow:var(--shadow); }
  #cardpop .cap { color:var(--text2); font-size:14px; font-weight:600; text-align:center; max-width:90%; }
  #cardpop .msg { color:var(--text2); font-size:14px; }
  #cardpop .dismiss { color:var(--text3); font-size:var(--fs-md); }

  /* ── Sheet (guide / combos overlay) ───── */
  .sheet { position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; flex-direction:column;
           animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both; }
  .sheet-head { display:flex; align-items:center; gap:12px; padding:
      calc(12px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 12px
      calc(14px + env(safe-area-inset-left));
    border-bottom:1px solid var(--border2); background:var(--bg2); }
  .sheet-head .stitle { flex:1; min-width:0; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-head .accent { font-size:var(--fs-sm); }
  .sheet-close { border:none; background:var(--surface2); color:var(--text); width:44px; height:44px;
                 border-radius:10px; font-size:18px; cursor:pointer; flex-shrink:0; }
  .sheet-body { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:
      16px calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }

  /* markdown */
  .md h1,.md h2,.md h3,.md h4 { line-height:1.25; margin:18px 0 8px; }
  .md h1 { font-size:21px; color:var(--mtg); } .md h2 { font-size:18px; }
  .md h3 { font-size:16px; } .md h4 { font-size:14px; color:var(--text2); }
  .md p { margin:8px 0; color:var(--text); font-size:14.5px; }
  .md ul,.md ol { margin:8px 0 8px 20px; } .md li { margin:4px 0; font-size:14.5px; }
  .md strong { color:var(--text); } .md em { color:var(--text2); }
  .md code { background:var(--surface2); padding:1px 5px; border-radius:5px; font-size:var(--fs-md); }
  .md pre { background:var(--surface2); padding:12px; border-radius:8px; overflow-x:auto; font-size:var(--fs-md); margin:10px 0; }
  .md blockquote { border-left:3px solid var(--mtg-dim); padding:2px 0 2px 12px; margin:10px 0; color:var(--text2); }
  .md hr { border:none; border-top:1px solid var(--border2); margin:16px 0; }
  .md a { color:var(--ygo); }
  .md table { width:100%; border-collapse:collapse; margin:10px 0; font-size:var(--fs-md); display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--border2); padding:6px 8px; text-align:left; vertical-align:top; }
  .md th { background:var(--surface2); color:var(--text2); font-weight:700; }
  /* Health tab (MTG) — same card/pill/chip language as the deck list */
  .hc-modes { display:flex; gap:6px; margin:0 0 10px; }
  .hc-summary { font-size:var(--fs-md); color:var(--text2); margin:0 2px 10px; }
  .hc-body { padding:4px 15px 14px; display:flex; flex-direction:column; gap:12px; }
  .hc-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .hc-chip { font-size:var(--fs-sm); padding:2px 8px; border-radius:20px; border:1px solid var(--mtg-dim); color:var(--mtg); }
  .hc-chip.cmd { background:color-mix(in srgb, var(--mtg) 15%, transparent); border-color:var(--mtg); }
  .hc-gaps { font-size:var(--fs-sm); color:var(--warn); margin-left:6px; }
  .hc-meters { display:grid; grid-template-columns:repeat(2,1fr); gap:9px 14px; }
  .hc-mtop { display:flex; justify-content:space-between; font-size:var(--fs-md); color:var(--text2); margin-bottom:4px; }
  .hc-mval { font-weight:700; } .hc-mval.ok { color:var(--ok); } .hc-mval.warn { color:var(--warn); } .hc-mval.bad { color:var(--err); }
  .hc-bar { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  .hc-fill { height:100%; border-radius:3px; } .hc-fill.ok { background:var(--ok); } .hc-fill.warn { background:var(--warn); } .hc-fill.bad { background:var(--err); }
  .hc-answers { font-size:var(--fs-md); color:var(--text3); line-height:1.5; }
  .hc-lbl { font-size:var(--fs-sm); font-weight:800; color:var(--text2); margin-bottom:5px; }
  .hc-item { display:flex; gap:8px; align-items:baseline; font-size:13.5px; line-height:1.45; margin:4px 0; }
  .hc-item span:nth-child(2) { flex:1; }
  .hc-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--text3); transform:translateY(-1px); }
  .hc-item.good .hc-dot { background:var(--ok); } .hc-item.high .hc-dot { background:var(--err); } .hc-item.med .hc-dot { background:var(--warn); }
  .hc-link { color:var(--mtg); font-size:var(--fs-md); white-space:nowrap; cursor:pointer; }
  .hc-toc { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px; }
  .hc-toc .chip { white-space:nowrap; min-height:44px; display:inline-flex; align-items:center; }
  /* the "Guide" link at the end of a health line is a full-height tap target */
  .hc-item .hc-link { display:inline-flex; align-items:center; justify-content:flex-end; min-height:44px; min-width:44px; }
  .hc-plan.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .hc-plan-more { margin-top:8px; min-height:44px; padding:0 14px; }
  .findown { font-size:var(--fs-sm); color:var(--text2); margin:2px 0 6px; }
  .md h2.hc-flash { background:color-mix(in srgb, var(--mtg) 18%, transparent); border-radius:6px; }
  .md a.hc-link { color:var(--mtg); font-size:inherit; white-space:normal; }

  /* combo navigator */
  .roots { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .roots button { min-height:40px; padding:0 13px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text2); font-size:var(--fs-md); font-weight:600; cursor:pointer; }
  .roots button.on { border-color:var(--ygo); color:var(--ygo); background:var(--surface2); }
  .crumb { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .crumb .back { min-height:40px; padding:0 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:var(--fs-md); cursor:pointer; }
  .crumb .path { font-size:var(--fs-sm); color:var(--text3); }
  .node { border:1px solid var(--border); border-radius:12px; padding:15px 16px; }
  .node.end { border-color:var(--ygo-gold); }
  .node .nname { font-size:16px; font-weight:700; }
  .ntag { display:inline-block; font-size:var(--fs-sm); padding:1px 8px; border-radius:20px; background:var(--surface2);
          color:var(--text2); margin-left:6px; vertical-align:1px; }
  .ntag.gold { background:color-mix(in srgb, var(--gold) 16%, transparent); color:var(--ygo-gold); }
  .ntag.warn { background:color-mix(in srgb, var(--warn) 14%, transparent); color:var(--warn); }
  .ndoes { font-size:13.5px; color:var(--text2); margin-top:8px; line-height:1.55; }
  .branch { border-top:1px solid var(--border2); padding-top:11px; margin-top:11px; display:flex; gap:11px; }
  .math { font-family:var(--font-mono); font-size:var(--fs-sm); background:var(--bg2);
          border-radius:6px; padding:3px 8px; white-space:nowrap; height:fit-content; }
  .branch .to { flex:1; min-width:0; }
  .branch .tolink { font-size:14px; font-weight:700; color:var(--ygo); cursor:pointer; }
  .branch .todesc { font-size:12.5px; color:var(--text2); margin-top:3px; line-height:1.5; }
  .gynote, .endnote { border-top:1px solid var(--border2); margin-top:11px; padding-top:11px;
                      font-size:12.5px; color:var(--text2); }

  .meta { font-size:var(--fs-md); color:var(--text3); text-align:center; margin:20px 0 4px; }

  /* swap rows */
  .swap-row{padding:8px 10px;border-top:1px solid var(--line,rgba(255,255,255,.08))}
  .swap-two{display:flex;flex-direction:column;gap:2px}
  .swap-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
  .swap-actions{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;align-items:center}
  /* Done and Skip are opposite actions tapped at the shelf: full-height targets, Done the wide one */
  .swap-actions .chip{min-height:44px;padding:0 16px;font-size:var(--fs-base);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .swap-actions .chip.act-done{flex:2}
  .swap-actions .chip.act-skip{flex:1}
  .swap-actions .box-sel{flex-basis:100%;min-height:44px}
  /* where the card comes from / goes to: its own line under the card, not a button-like tag */
  .swap-src{display:flex;align-items:center;gap:5px;margin:0 0 3px 17px;font-size:var(--fs-md);font-weight:700;color:var(--text)}
  .swap-src.ret{font-weight:400;color:var(--text2)}
  .swap-kind{margin-left:auto;font-size:var(--fs-sm);color:var(--text2)}
  .swap-row .tag{font-size:var(--fs-sm);padding:1px 6px;border-radius:4px;background:color-mix(in srgb, var(--wash) 6%, transparent)}
  .swap-row .tag.ok{color:var(--ok)}
  .plan-step{padding:5px 10px;font-size:14px;border-top:1px solid var(--line,rgba(255,255,255,.06))}
  .muted{opacity:.6}
  .chip{font-size:var(--fs-md);padding:4px 9px;border-radius:7px;background:color-mix(in srgb, var(--wash) 7%, transparent);border:1px solid var(--line,rgba(255,255,255,.12));color:var(--text,#eee);cursor:pointer}
  .chip.on{background:var(--mtg,#c9a227);color:var(--shade);border-color:var(--mtg,#c9a227)}
  .box-sel{max-width:100%;font-size:var(--fs-md);padding:3px 6px;border-radius:6px;background:color-mix(in srgb, var(--wash) 6%, transparent);color:var(--text,#eee);border:1px solid var(--line,rgba(255,255,255,.12))}
  .tag.pending{color:var(--warn)}
  /* Printings sheet (flip mode): the owned printings of one card as pictures */
  .pq-head{font-size:var(--fs-md);margin:0 0 8px}
  .pq-name{font-size:17px;font-weight:700;margin:10px 0 2px}
  .pq-note{font-size:var(--fs-md);margin:0 0 4px}
  .pq-saved{font-size:var(--fs-md);color:var(--mtg);margin:8px 0 2px}
  .pq-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:8px 0 10px}
  .pq-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;border-radius:9px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);font-size:var(--fs-md);cursor:pointer}
  .pq-tile img{width:100%;aspect-ratio:146/204;border-radius:6px;background:var(--surface2);object-fit:cover}
  .pq-tile .muted{font-size:var(--fs-xs);text-align:center;line-height:1.2}
  .pq-tile.on{border-color:var(--mtg);background:var(--surface2)}

  /* Little Troubles (toddler pink) */
  .lt-subnav{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
  .lt-sub{font-size:var(--fs-md);font-weight:600;padding:7px 14px;border-radius:99px;background:color-mix(in srgb, var(--wash) 6%, transparent);border:1px solid var(--line,rgba(255,255,255,.12));color:var(--text2,#9aa);cursor:pointer}
  .lt-sub.on{background:color-mix(in srgb, var(--lt) 18%, transparent);color:var(--lt);border-color:var(--lt)}
  .deck.lt .deck-head{border-left:3px solid var(--lt)}
  .lt-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-top:1px solid var(--line,rgba(255,255,255,.06))}
  .lt-row .cname{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lt-step{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:color-mix(in srgb, var(--wash) 7%, transparent);border:1px solid var(--line,rgba(255,255,255,.12));color:var(--text,#eee);font-size:18px;font-weight:700;line-height:1;cursor:pointer}
  .lt-q{min-width:18px;text-align:center;font-weight:700;font-size:14px}
  .lt-q.over{color:var(--danger)}
  .lt-own{font-size:var(--fs-sm);color:var(--text3,#789);flex-shrink:0}
  .lt-1{color:var(--warn);font-weight:700;font-size:var(--fs-sm)}
  .lt-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .lt-chip{font-size:var(--fs-md);padding:5px 11px;border-radius:99px;background:color-mix(in srgb, var(--wash) 6%, transparent);border:1px solid var(--line,rgba(255,255,255,.12));color:var(--text2,#9aa);cursor:pointer}
  .lt-chip.on{background:color-mix(in srgb, var(--lt) 18%, transparent);color:var(--lt);border-color:var(--lt)}
  .lt-count{font-size:var(--fs-sm);color:var(--text3,#789);margin:4px 0 8px}
  .lt-crow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 8px;border-top:1px solid var(--line,rgba(255,255,255,.06))}
  .lt-crow .cname{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lt-crow .lt-meta{font-size:var(--fs-sm);color:var(--text3,#789);flex-shrink:0}
  #cardpop-dual img{max-height:70vh}

  /* Little Troubles — scan sub-view */
  .lt-cam-wrap{position:relative;width:100%;aspect-ratio:63/88;max-height:60vh;margin:8px auto;background:var(--shade);border-radius:14px;overflow:hidden}
  #lt-cam{width:100%;height:100%;object-fit:cover}
  .lt-guide{position:absolute;inset:3px;border:2px dashed color-mix(in srgb, var(--wash) 70%, transparent);border-radius:10px;pointer-events:none}
  .lt-cam-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--on-fill);text-align:center;padding:12px}
  .lt-scan-controls{display:flex;gap:10px;align-items:center;justify-content:center;margin:8px 0}
  .lt-shutter,.lt-commit{background:var(--lt,#7ec8e3);color:var(--surface2);border:0;border-radius:10px;padding:10px 18px;font-weight:700}
  .lt-photo-btn{border:1px solid var(--lt,#7ec8e3);color:var(--lt,#7ec8e3);border-radius:10px;padding:10px 14px}
  .lt-cam-start{position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;background:var(--lt,#7ec8e3);color:var(--surface2);border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}
  .lt-manual-row{display:flex;gap:8px;margin:8px 0}
  .lt-manual-row input{flex:1;min-width:0;background:var(--surface2,#1a2230);border:1px solid var(--border,#444);color:var(--text,#eee);border-radius:10px;padding:9px 12px;font-size:14px}
  .lt-batch{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .lt-brow{display:flex;align-items:center;gap:8px}
  .lt-thumb{width:34px;height:48px;object-fit:cover;border-radius:5px;background:var(--surface)}
  .lt-src{opacity:.8}
  .lt-commit{width:100%;margin-top:10px}
  .lt-review h3{margin:4px 0 10px;font-size:15px}
  .lt-dest{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .lt-cancel{background:none;border:1px solid var(--border,#444);color:var(--text2,#aaa);border-radius:10px;padding:8px;width:100%;margin-top:8px}

  /* update banner */
  #upd { display:none; position:fixed; left:0; right:0; bottom:0; z-index:60;
         padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
         background:var(--mtg); color:var(--warn-bg); font-weight:700; text-align:center; font-size:14px;
         box-shadow:var(--shadow); cursor:pointer; animation:sheetUp .3s ease both; }

  /* ── Clean theme (2026-10-04) ── light gray page, white bordered cards, Lato, sentence-case labels */
  body { background:var(--bg); font-family:var(--font-body); }
  button, input, select, textarea { font-family:inherit; }
  .brand h1 { font-family:var(--font-display); font-weight:900; letter-spacing:-.2px; font-size:24px; }
  .brand h1 .g { color:var(--mtg); }
  .accent-strip { display:none; }
  .tabs { background:var(--surface); border:1px solid var(--border); border-radius:6px; box-shadow:none; backdrop-filter:none; }
  .tabs button { font-weight:700; border-radius:4px; }
  .tabs button.on { background:var(--surface3); box-shadow:none; }
  .deck, .findcard, .node, .deck.mtg, .deck.ygo { border-radius:6px; border:1px solid var(--border); box-shadow:none; }
  .actions button { border-radius:4px; background:var(--surface); font-weight:700; }
  .btn-primary { color:var(--on-fill); border-radius:4px; }
  .sheet-head { background:var(--surface); border-bottom:1px solid var(--border); }
  /* each swap / printing is its own bordered card on the gray sheet */
  .swap-row { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
  .swap-actions .chip { background:var(--surface); border:1px solid var(--border); }
  .swap-actions .chip.on { background:var(--mtg); color:var(--on-fill); }   /* the tapped choice stays filled */
  .sheet-body > .hc-body { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:14px 15px; margin-bottom:10px; }
  /* labels in sentence case, not spaced-out capitals */
  

  /* coloured badges, chips and buttons get a black outline (same rule as the desktop) */
  .pill, .chip, .tag, .hc-chip, .ntag, .actions button, .btn-primary, .findtabs button.on, .lt-sub.on { border:1px solid var(--ink-outline) !important; }

  /* banded lists and boxed power pill (same rules as the desktop) */
  .card { padding:5px 6px; border-radius:4px; }
  .card:nth-child(even of .card), table tbody tr:nth-child(even) { background:var(--zebra); }

  /* group titles as small bars (same as the desktop decklist headings) */
  .gtitle { background:var(--head-bg); border:1px solid var(--border2); border-radius:4px; padding:5px 8px; font-size:var(--fs-md); font-weight:700; color:var(--text); }

  /* Cuts and adds as colour boxes; Health role counts boxed by status (Jake, 2026-10-04) */
  .cut-name { color: var(--danger-text); font-weight: 700; }
  .add-name { color: var(--ok-text); font-weight: 700; }
  .hc-mval { padding:0 6px; border:1px solid var(--ink-outline); border-radius:4px; }
  .hc-mval.ok { background:var(--ok-bg); color:var(--ok-text); } .hc-mval.warn { background:var(--warn-bg); color:var(--warn-text); } .hc-mval.bad { background:var(--danger-bg); color:var(--danger-text); }
  .hc-mval .muted { color:inherit; font-weight:400; }

  .mana-sym { display:inline-block; vertical-align:-2px; font-size:11px; font-weight:700; color:var(--text2); }

  .card .ccost { margin-left:auto; white-space:nowrap; display:inline-flex; align-items:center; gap:1px; }
</style>
</head>

<div class="brand"><h1>deckbuilder<span class="g">.</span></h1><span class="brand-sub">mobile</span></div>
<div class="accent-strip"></div>

<div id="gate">
  <div class="label" id="gate-label"></div>
  <p>Enter your passphrase to unlock.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" enterkeyhint="go">
  <button class="btn-primary" onclick="unlock()">Unlock</button>
  <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <div class="err" id="err"></div>
</div>

<div id="app" style="display:none;">
  <div class="label" id="app-label"></div>

  <input id="search" class="search" type="search" placeholder="Filter decks…" oninput="setFilter(this.value)">
  <div class="sortrow" id="sortrow">

    <select id="sortsel" class="sortsel" onchange="setSort(this.value)">
      <option value="name">Name</option>

      <option value="count">Card count</option>

    <select id="playersel" class="sortsel" onchange="setPlayer(this.value)"></select>
  </div>
  <div class="hint">Tap any card to view it.</div>
  <div id="decks"></div>
  <div class="meta" id="meta"></div>
</div>

<div id="sheet-root"></div>
<div id="cardpop" onclick="hideCard()">

  <div class="msg" id="cardpop-msg">Loading…</div>
  <div class="cap" id="cardpop-cap"></div>

</div>

// ── crypto (mirrors scripts/mobile-crypto.mjs) ──
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations, hash:'SHA-256' }, base,
    { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
let _pass = null; // the passphrase this session unlocked with (the standalone Little Troubles app encrypts its saves with it)
// Same format as scripts/mobile-crypto.mjs encryptPayload / decryptPayload.
async function encryptJson(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt, ENC.iterations);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { salt: b64u(salt), iv: b64u(iv), ct: b64u(new Uint8Array(ct)), iterations: ENC.iterations };
}
async function decryptJson(enc, pass) {
  const key = await deriveKey(pass, ub64(enc.salt), enc.iterations);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(enc.iv) }, key, ub64(enc.ct))));
}
async function tryDecrypt(pass) {
  const key = await deriveKey(pass, ub64(ENC.salt), ENC.iterations);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: ub64(ENC.iv) }, key, ub64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function unlock() {
  const pass = document.getElementById('pass').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    DATA = await tryDecrypt(pass);
    _pass = pass;
    if (DATA.ltOnly) await ltaInit();
    ltReconcileLocal();
    if (document.getElementById('remember').checked) localStorage.setItem('dv_pass', pass);
    show();
    flushDecisions();
    flushLT();
    flushPrintings();
  } catch { err.textContent = 'Wrong passphrase.'; }
}
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function show() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = '';
  document.getElementById('app-label').textContent = DATA.label || LABEL;
  if (DATA.ltOnly) {   // the standalone Little Troubles app: no other games, no Find / Plan / Guide
    activeTab = 'lt';
    document.querySelector('.brand h1').textContent = 'Little Troubles';
    const sub = document.querySelector('.brand-sub'); if (sub) sub.style.display = 'none';
    document.getElementById('app-label').style.display = 'none';
    document.title = 'Little Troubles';
  }
  const tabs = [];
  if (DATA.mtg.length) tabs.push(['mtg', `EDH ${DATA.mtg.length}`, 'mtg']);   // paper Commander decks
  if (DATA.arena && DATA.arena.length) tabs.push(['arena', `Arena ${DATA.arena.length}`, 'arena']);
  if (DATA.ygo.length) tabs.push(['ygo', `YGO ${DATA.ygo.length}`, 'ygo']);
  if (DATA.lt) tabs.push(['lt', 'LT', 'lt']);
  tabs.push(['find', ic('search', 14) + ' Find', '']);
  if (DATA.upgradePlan) tabs.push(['plan', ic('list', 14) + ' Plan', '']);
  if (DATA.mtgHealth) tabs.push(['health', ic('book', 14) + ' Guide', '']); // deck health opens from each deck's Health button
  if (DATA.ltOnly) tabs.length = 0;
  document.getElementById('tabs').style.display = tabs.length ? '' : 'none';
  if (!DATA.ltOnly && !tabs.some(t => t[0] === activeTab)) activeTab = tabs[0]?.[0] || 'mtg';
  document.body.dataset.game = ['mtg', 'ygo', 'lt', 'arena'].includes(activeTab) ? activeTab : '';
  document.getElementById('tabs').innerHTML = tabs.map(([k, lbl, cls]) =>
    `<button class="${k === activeTab ? 'on ' + cls : ''}" onclick="setTab('${k}')">${lbl}</button>`).join('');
  if (DATA.ltOnly) ltaStatus(); else document.getElementById('meta').textContent = `Updated ${new Date(DATA.generated).toLocaleString()}`;
  const inFind = activeTab === 'find';
  const noList = activeTab === 'find' || activeTab === 'plan' || activeTab === 'health' || activeTab === 'lt'; // LT has its own sub-nav/search
  document.getElementById('search').style.display = noList ? 'none' : '';
  document.getElementById('sortrow').style.display = (noList || activeTab === 'arena') ? 'none' : '';
  const hint = document.querySelector('.hint'); if (hint) hint.style.display = noList ? 'none' : '';
  if (activeTab === 'plan') renderPlan(); else if (activeTab === 'health') renderHealth(); else if (inFind) renderFind(); else if (activeTab === 'lt') renderLT(); else render();
}
function setTab(k) { if (activeTab === 'lt' && k !== 'lt') ltScanUnmount(); activeTab = k; show(); }
function toggleDeck(el) { el.classList.toggle('open'); const b = el.querySelector('.deck-body'); b.hidden = !b.hidden; }

// A mana cost as symbol images (same as the desktop decklist); offline, the alt letters show
function costHtml(cost) {
  return (String(cost || '').match(/\{[^}]+\}/g) || []).map(s => {
    const code = s.replace(/[{}\/]/g, '').toUpperCase();
    return `<img class="mana-sym" src="https://svgs.scryfall.io/card-symbols/${encodeURIComponent(code)}.svg" alt="${esc(code)}" width="14" height="14" loading="lazy">`;
  }).join('');
}
// Card-type icon for a decklist group heading (mana-font); '' for groups with no icon.
const TYPE_ICON = { C: 'ms-creature', I: 'ms-instant', S: 'ms-sorcery', A: 'ms-artifact', E: 'ms-enchantment', P: 'ms-planeswalker', B: 'ms-battle', L: 'ms-land' };
function typeIcon(letter) { return TYPE_ICON[letter] ? `<i class="ms ${TYPE_ICON[letter]}" aria-hidden="true"></i>` : ''; }
// A small art thumbnail for a card name (Scryfall art crop). Loads only when scrolled to; offline it is left out.
function thumbHtml(name) {
  if (!name || String(name).startsWith('[')) return '';
  return `<img class="cthumb" loading="lazy" alt="" src="https://api.scryfall.com/cards/named?exact=${encodeURIComponent(String(name).split(' // ')[0])}&format=image&version=art_crop" onerror="this.remove()">`;
}

// An MTG Arena deck (read-only on the phone): Standard status, grouped list, open swaps.
function arenaDeckCard(d, i) {
  const count = cs => cs.reduce((s, c) => s + c.q, 0);
  const b = d.banner;
  const art = (b && b.img) ? `<div class="deckart" style="background-image:url('${esc(b.img)}');background-size:cover;background-position:50% 30%;"></div>` : '';
  const status = (d.errors.length ? `<div class="astatus bad"><strong>Not legal in Standard yet.</strong>${d.errors.map(m => `<div>${esc(m)}</div>`).join('')}</div>` : '')
    + (d.warns.length ? `<div class="astatus warn"><strong>Leaving Standard soon:</strong>${d.warns.map(m => `<div>${esc(m)}</div>`).join('')}</div>` : '');
  const rows = cs => cs.map(c => `<div class="card" data-card="${esc(c.n)}" data-game="mtg"><span class="q">${c.q}×</span><span class="cname">${esc(c.n)}${c.lv ? `<span class="lvtag">Leaves ${esc(c.lv)}</span>` : ''}</span>${c.m ? `<span class="ccost">${costHtml(c.m)}</span>` : ''}</div>`).join('');
  const groups = MTG_GROUPS.map(([letter, title]) => {
    const cs = d.main.filter(c => (c.t || '') === letter);
    return cs.length ? `<div class="group"><div class="gtitle">${typeIcon(letter)}${title} · ${count(cs)}</div>${rows(cs)}</div>` : '';
  }).join('') + (d.side.length ? `<div class="group"><div class="gtitle">Sideboard · ${count(d.side)}</div>${rows(d.side)}</div>` : '');
  const swaps = d.swaps.length ? `<div class="group"><div class="gtitle">Upgrade plan · ${d.swaps.length}</div>${d.swaps.map(s => `<div class="aswap">
      <div class="swap-line"><span style="color:var(--ok);font-weight:700;">+</span> ${thumbHtml(s.add)}<strong class="add-name">${s.addQty > 1 ? s.addQty + '× ' : ''}${tapCard(s.add)}</strong></div>
      <div class="swap-line"><span style="color:var(--danger);font-weight:700;">−</span> ${thumbHtml(s.remove)}<span class="cut-name">${s.removeQty > 1 ? s.removeQty + '× ' : ''}${tapCard(s.remove)}</span>${s.section === 'sideboard' ? ' <span class="pill">Sideboard</span>' : ''}</div>
      ${s.reason ? `<div class="why">${esc(s.reason)}</div>` : ''}</div>`).join('')}</div>` : '';
  const legal = d.errors.length ? `<span class="pill" style="color:var(--danger-text);background:var(--danger-bg);">${d.errors.length} issue${d.errors.length !== 1 ? 's' : ''}</span>` : '<span class="pill" style="color:var(--ok-text);background:var(--ok-bg);">Standard legal</span>';
  return `<div class="deck arena" style="animation-delay:${Math.min(i * 25, 250)}ms">
    ${art}
    <div class="deck-head" onclick="toggleDeck(this.parentNode)">
      <div class="info"><div class="dname">${esc(d.deck)}${pipsHtml(d.colors)}</div><div class="dsub">${esc(d.format[0].toUpperCase() + d.format.slice(1))} · ${count(d.main)} cards${d.side.length ? ` + ${count(d.side)} sideboard` : ''} ${legal}${d.swaps.length ? ` <span class="pill">${d.swaps.length} swap${d.swaps.length !== 1 ? 's' : ''}</span>` : ''}</div></div>
      <div class="chev">▶</div>
    </div>
    <div class="deck-body" hidden>${status}${swaps}${groups || '<div class="empty">No cards.</div>'}</div>
  </div>`;
}

function cardRows(cards, game) {
  return cards.map(c => `<div class="card" data-card="${esc(c.n)}" data-game="${game}"><span class="q">${c.q}×</span><span class="cname">${esc(c.n)}</span>${c.m ? `<span class="ccost">${costHtml(c.m)}</span>` : ''}</div>`).join('');
}

// ManaBox import text for an MTG deck. Format per manabox.app/guides/decks/import-export:
// a "// COMMANDER" block, a blank line, then the mainboard; card lines are
// "qty Name (SET) NUM" with the printing optional and *F* / *E* marking foil / etched.
// c.p is the pre-formatted suffix the exporter resolved from the collection CSV; cards
// whose printing wasn't knowable have no c.p and import by name alone.
function manaboxText(d) {
  const line = c => `${c.q} ${c.n}${c.p ? ' ' + c.p : ''}`;
  const [cmd, ...rest] = d.cards || [];
  if (!cmd) return '';
  return ['// COMMANDER', line(cmd), '', ...rest.map(line)].join('\n');
}

// Copy to clipboard, then paste into ManaBox's import screen. Reports printing coverage
// on the button itself so a low number is visible before Jake trusts the imported art.
async function copyManabox(i, btn) {
  const d = DATA.mtg[i];
  const txt = manaboxText(d);
  if (!txt) return;
  const orig = btn.innerHTML;
  try {
    await navigator.clipboard.writeText(txt);
    const n = d.cards.filter(c => c.p).length;
    btn.innerHTML = `${ic('check', 14)} Copied · ${n}/${d.cards.length}`;
  } catch {
    btn.innerHTML = `${ic('x', 14)} Copy failed`;
  }
  setTimeout(() => { btn.innerHTML = orig; }, 2200);
}

// Power-level colors (mirror app.js PWR_COLORS / YGO_PWR_COLORS).
const PWR_COLORS = { 1:'#7a7161', 2:'#2f8a52', 3:'#55730f', 4:'#9a6208', 5:'#c43a24' };
const YGO_PWR_COLORS = { 1:'#7a7161', 2:'#2f8a52', 3:'#9a6208', 4:'#c43a24' };

function pipsHtml(colors) {
  const order = ['W', 'U', 'B', 'R', 'G'];
  const present = order.filter(c => (colors || []).includes(c));
  const list = present.length ? present : ['C']; // colorless
  // official mana symbols (same as the desktop); offline, the alt letter shows
  return '<span class="pips">' + list.map(c => `<img class="mana-sym" src="https://svgs.scryfall.io/card-symbols/${c}.svg" alt="${c}" width="15" height="15" loading="lazy">`).join('') + '</span>';
}

function sectionHeader(label, count, color) {
  return `<div class="section"><span class="bar" style="background:${color};"></span>` +
         `<span class="lbl" style="color:${color};">${esc(label)}</span><span class="ct">${count}</span></div>`;
}

function deckCard(d, game, gIdx, dimmed) {
  const total = game === 'mtg' ? d.cards.reduce((s, c) => s + c.q, 0) : d.main.reduce((s, c) => s + c.q, 0);
  const pc = (game === 'mtg' ? PWR_COLORS : YGO_PWR_COLORS)[d.powerLevel];
  const pl = d.powerLevel
    ? `<span class="pill" style="border-color:${pc || 'var(--border)'};color:${pc || 'var(--text2)'};background:color-mix(in srgb, ${pc || 'var(--text3)'} 12%, var(--surface));font-weight:700;">${game === 'mtg' ? 'B' : 'Lv'}${d.powerLevel}${d.subScore ? ' · ' + d.subScore + '/10' : ''}</span>`
    : '';
  const pips = game === 'mtg' ? pipsHtml(d.colors) : '';
  let sub;
  if (game === 'mtg') sub = `${esc(d.player)} · ${total} cards`;
  else {
    const ex = d.extra.reduce((s, c) => s + c.q, 0), sd = d.side.reduce((s, c) => s + c.q, 0);
    sub = `${total} main · ${ex} extra` + (sd ? ` · ${sd} side` : '');
  }
  const b = d.banner;
  const art = (b && b.img)
    ? `<div class="deckart" style="background-image:url('${esc(b.img)}');background-size:${(b.zoom || 1) * 100}% auto;background-position:${((b.fx ?? 0.5) * 100).toFixed(1)}% ${((b.fy ?? 0.5) * 100).toFixed(1)}%;"></div>`
    : '';
  const acts = [];
  if (game === 'mtg') { const e = _hFor(d); if (e) { const g = _hGaps(e); acts.push(`<button class="guide" onclick="event.stopPropagation();openHealth(${gIdx})">${ic('check', 14)} Health${g ? ' · ' + g : ''}</button>`); } }
  if (d.guide) acts.push(`<button class="guide" onclick="openGuide('${game}',${gIdx})">${ic('book', 14)} Guide</button>`);
  if (d.combo) acts.push(`<button class="combos" onclick="openCombos('${game}',${gIdx})">${ic('fork', 14)} Combos</button>`);
  // d.swaps is already filtered to pending work (unapplied OR applied-not-yet-moved), so count all
  // of them — a bare !s.applied here drops staged physical moves and undercounts the badge.
  if (game === 'mtg' && d.swaps && d.swaps.length) acts.push(`<button class="swaps" onclick="event.stopPropagation();openSwaps(${gIdx})">${ic('repeat', 14)} Swaps · ${d.swaps.length}</button>`);
  if (game === 'mtg' && d.printQ?.length) acts.push(`<button class="guide" id="pqbtn-${gIdx}" onclick="event.stopPropagation();openPrintings(${gIdx})">${ic('box', 14)} ${printBtnText(d)}</button>`);
  if (game === 'mtg' && d.virtual && d.findCards?.groups?.length) acts.push(`<button class="guide" onclick="event.stopPropagation();openFindCards(${gIdx})">${ic('search', 14)} Find Cards</button>`);
  if (game === 'mtg' && d.cards.length) acts.push(`<button class="manabox" onclick="event.stopPropagation();copyManabox(${gIdx},this)">${ic('copy', 14)} Manabox</button>`);
  const actions = acts.length ? `<div class="actions">${acts.join('')}</div>` : '';
  let body;
  if (game === 'mtg') {
    body = MTG_GROUPS.map(([letter, title]) => {
      const cs = d.cards.filter(c => (c.t || '') === letter);
      if (!cs.length) return '';
      const n = cs.reduce((s, c) => s + c.q, 0);
      return `<div class="group"><div class="gtitle">${typeIcon(letter)}${title} · ${n}</div>${cardRows(cs, 'mtg')}</div>`;
    }).join('');
  } else {
    const sec = (t, cs) => cs.length ? `<div class="group"><div class="gtitle">${t} · ${cs.reduce((s, c) => s + c.q, 0)}</div>${cardRows(cs, 'ygo')}</div>` : '';
    body = sec('Main Deck', d.main) + sec('Extra Deck', d.extra) + sec('Side Deck', d.side);
  }
  return `<div class="deck ${game}${dimmed ? ' dim' : ''}" style="animation-delay:${Math.min(gIdx * 25, 250)}ms">
    ${art}
    <div class="deck-head" onclick="toggleDeck(this.parentNode)">
      <div class="info"><div class="dname">${esc(d.deck)}${pips}</div><div class="dsub">${sub} ${pl}${game === 'mtg' && d.virtual ? '<span class="pill" style="border-color:var(--mtg-dim);color:var(--mtg);">Virtual</span>' : ''}${game === 'mtg' && d.swaps && d.swaps.length ? `<span class="pill" style="border-color:var(--mtg-dim);color:var(--mtg);">${d.swaps.length} swap${d.swaps.length === 1 ? '' : 's'}</span>` : ''}</div></div>
      <div class="chev">▶</div>
    </div>
    <div class="deck-body" hidden>${actions}${body || '<div class="empty">No cards.</div>'}</div>
  </div>`;
}

let _filter = '';
function setFilter(v) { _filter = v; render(); }
function matchesFilter(d) {
  const f = _filter.trim().toLowerCase();
  if (!f) return true;
  return d.deck.toLowerCase().includes(f) || (d.commander || '').toLowerCase().includes(f);
}

let _sort = 'name';
function setSort(v) { _sort = v; render(); }
// Show one player's Magic decks or everyone's (Jake, 2026-10-05); remembered on this phone.
let _player = (() => { try { return localStorage.getItem('dv-player') || ''; } catch { return ''; } })();
function setPlayer(v) { _player = v; try { localStorage.setItem('dv-player', v); } catch {} render(); }
function _deckTotal(d) { return (d.cards ? d.cards : d.main).reduce((s, c) => s + c.q, 0); }
function sortDecks(items) {
  const ts = v => (v ? new Date(v).getTime() : 0);
  return [...items].sort((x, y) => {
    const a = x.d, b = y.d;
    if (_sort === 'power') return (b.powerLevel || 0) - (a.powerLevel || 0) || (b.subScore || 0) - (a.subScore || 0) || a.deck.localeCompare(b.deck);
    if (_sort === 'opened') return ts(b.lastOpened) - ts(a.lastOpened) || a.deck.localeCompare(b.deck);
    if (_sort === 'modified') return (b.lastModified || 0) - (a.lastModified || 0) || a.deck.localeCompare(b.deck);
    if (_sort === 'count') return _deckTotal(b) - _deckTotal(a) || a.deck.localeCompare(b.deck);
    return a.deck.localeCompare(b.deck);
  });
}

function render() {
  const el = document.getElementById('decks');
  if (activeTab === 'arena') {
    document.getElementById('playersel').style.display = document.getElementById('playerlbl').style.display = 'none';
    const f = _filter.trim().toLowerCase();
    const list = (DATA.arena || []).map((d, i) => ({ d, i })).filter(x => !f || x.d.deck.toLowerCase().includes(f) || (x.d.face || '').toLowerCase().includes(f));
    el.innerHTML = list.length ? sectionHeader('MTG Arena', list.length, 'var(--info)') + list.map(x => arenaDeckCard(x.d, x.i)).join('') : '<div class="empty">No decks match.</div>';
    return;
  }
  if (activeTab === 'mtg') {
    // Group by player (Jake / Sean), players ordered by deck count desc — like the desktop.
    const idx = DATA.mtg.map((d, i) => ({ d, i })).filter(x => matchesFilter(x.d));
    const players = [...new Set(DATA.mtg.map(d => d.player))]
      .sort((a, b) => DATA.mtg.filter(d => d.player === b).length - DATA.mtg.filter(d => d.player === a).length || a.localeCompare(b));
    if (_player && !players.includes(_player)) _player = '';
    const sel = document.getElementById('playersel');
    sel.innerHTML = ['', ...players].map(p => `<option value="${esc(p)}"${p === _player ? ' selected' : ''}>${p ? esc(p) : 'All'}</option>`).join('');
    sel.style.display = document.getElementById('playerlbl').style.display = '';
    let h = '';
    for (const p of players) {
      if (_player && p !== _player) continue;
      const ds = sortDecks(idx.filter(x => x.d.player === p));
      // virtual decks (not built yet) get their own section under the player
      const built = ds.filter(x => !x.d.virtual), virt = ds.filter(x => x.d.virtual);
      if (built.length) h += sectionHeader(p, built.length, 'var(--mtg)') + built.map(x => deckCard(x.d, 'mtg', x.i, false)).join('');
      if (virt.length) h += sectionHeader(_player ? 'Virtual' : `${p} · Virtual`, virt.length, 'var(--text3)') + virt.map(x => deckCard(x.d, 'mtg', x.i, false)).join('');
    }
    el.innerHTML = h || '<div class="empty">No decks match.</div>';
    return;
  }
  // YGO grouped like the app: Meta → Off-Meta → Physical (indices into DATA.ygo are stable refs).
  document.getElementById('playersel').style.display = document.getElementById('playerlbl').style.display = 'none';
  const idx = DATA.ygo.map((d, i) => ({ d, i })).filter(x => matchesFilter(x.d));
  const meta = sortDecks(idx.filter(x => x.d.kind === 'md' && !x.d.offMeta));
  const off  = sortDecks(idx.filter(x => x.d.kind === 'md' && x.d.offMeta));
  const phys = sortDecks(idx.filter(x => x.d.kind === 'physical'));
  let h = '';
  if (meta.length) h += sectionHeader('Meta', meta.length, 'var(--ygo)') + meta.map(x => deckCard(x.d, 'ygo', x.i, false)).join('');
  if (off.length)  h += sectionHeader('Off-Meta', off.length, 'var(--text2)') + off.map(x => deckCard(x.d, 'ygo', x.i, true)).join('');
  if (phys.length) h += sectionHeader('Physical', phys.length, 'var(--ygo-gold)') + phys.map(x => deckCard(x.d, 'ygo', x.i, false)).join('');
  el.innerHTML = h || '<div class="empty">No decks match.</div>';
}

// ── Find a card (reverse lookup: card → which decks) ──
let findGame = 'mtg', findQuery = '';
function setFindGame(g) { findGame = g; renderFind(); }
function setFindQuery(v) { findQuery = v; renderFindResults(); }

function renderFind() {
  if (!DATA.mtg.length) findGame = 'ygo';
  if (!DATA.ygo.length) findGame = 'mtg';
  document.getElementById('decks').innerHTML =
    `<div class="findtabs">
       <button class="${findGame === 'mtg' ? 'on mtg' : ''}" onclick="setFindGame('mtg')">MTG</button>
       <button class="${findGame === 'ygo' ? 'on ygo' : ''}" onclick="setFindGame('ygo')">YGO</button>
     </div>
     <input id="findinput" class="search" type="search" placeholder="Search a ${findGame.toUpperCase()} card by name…" oninput="setFindQuery(this.value)" value="${esc(findQuery)}">
     <div id="findresults"></div>`;
  renderFindResults();
}

function renderFindResults() {
  const out = document.getElementById('findresults');
  if (!out) return;
  const q = findQuery.trim().toLowerCase();
  if (q.length < 2) { out.innerHTML = `<div class="hint" style="margin:8px 2px;">Type at least 2 letters to find a ${findGame.toUpperCase()} card across your decks.</div>`; return; }
  const map = new Map();
  const add = (name, deck, qty, tag) => {
    if (!name.toLowerCase().includes(q)) return;
    if (!map.has(name)) map.set(name, []);
    map.get(name).push({ deck, qty, tag });
  };
  if (findGame === 'mtg') {
    for (const d of DATA.mtg) for (const c of d.cards) add(c.n, d.deck, c.q, d.player);
  } else {
    for (const d of DATA.ygo) {
      for (const c of d.main) add(c.n, d.deck, c.q, 'main');
      for (const c of d.extra) add(c.n, d.deck, c.q, 'extra');
      for (const c of d.side) add(c.n, d.deck, c.q, 'side');
    }
  }
  // Owned / free / box line (Magic): owned and box come with the export (DATA.owned), sleeved and
  // queued are counted here from the decks and open swaps; the wording is MtgRoles.ownedLine.
  const ownLine = (() => {
    if (findGame !== 'mtg' || !DATA.owned || typeof MtgRoles === 'undefined' || !MtgRoles.ownedLine) return () => '';
    const sleeved = {}, queued = {};
    for (const d of DATA.mtg) {
      for (const c of d.cards) { const k = MtgRoles.nameKey(c.n); sleeved[k] = (sleeved[k] || 0) + c.q; }
      for (const s of d.swaps || []) { if (s.applied || s.synthetic || (s.pullFrom && s.pullFrom.deck) || !s.add || s.add.startsWith('[')) continue; const k = MtgRoles.nameKey(s.add); queued[k] = (queued[k] || 0) + 1; }
    }
    return name => { const k = MtgRoles.nameKey(name), o = DATA.owned[k]; return MtgRoles.ownedLine(name, o ? o[0] : 0, sleeved[k], queued[k], o ? o[1] : ''); };
  })();
  const names = [...map.keys()].sort((a, b) => a.localeCompare(b));
  if (!names.length) { out.innerHTML = `<div class="empty">No ${findGame.toUpperCase()} card matches “${esc(findQuery)}”.</div>`; return; }
  const cap = 80;
  out.innerHTML = names.slice(0, cap).map(name => {
    const locs = map.get(name);
    const deckCount = new Set(locs.map(l => l.deck)).size;
    const chips = locs.map(l => `<span class="findchip" data-deckname="${esc(l.deck)}" data-deckgame="${findGame}">${esc(l.deck)} <b>×${l.qty}</b>${findGame === 'mtg' ? ` <i>${esc(l.tag)}</i>` : (l.tag !== 'main' ? ` <i>${esc(l.tag)}</i>` : '')}</span>`).join('');
    return `<div class="findcard">
      <div class="findname" data-card="${esc(name)}" data-game="${findGame}"><span class="u">${esc(name)}</span><span class="findmeta">in ${deckCount} deck${deckCount > 1 ? 's' : ''}</span></div>${ownLine(name) ? `<div class="findown">${esc(ownLine(name))}</div>` : ''}
      <div class="findchips">${chips}</div>
    </div>`;
  }).join('') + (names.length > cap ? `<div class="hint" style="margin:10px 2px;">Showing ${cap} of ${names.length} — keep typing to narrow.</div>` : '');
}

// Tappable card name → opens the image via the global showCard handler. Placeholders
// ([OPEN SLOT], [Find replacement…]) and basics aren't real cards, so they stay plain text.
function tapCard(name) {
  if (!name || name === '[OPEN SLOT]' || String(name).startsWith('[Find replacement')) return `<span class="muted">${esc(name || '')}</span>`;
  return `<span data-card="${esc(name)}" data-game="mtg" style="cursor:pointer;border-bottom:1px dotted var(--mtg-dim);">${esc(name)}</span>`;
}
// Source/destination tags for a swap — mirrors the desktop Swap Order: where the incoming
// card comes from (↑ from deck), where the cut goes (↓ to deck), box, and power impact.
// Location tags split PER CARD so each tag sits with its own card instead of being pooled in one
// row. The incoming (+) card shows where it comes FROM; the outgoing (−) card shows where it goes.
// Where the incoming card comes from, on its own line under the card: at the shelf this is the one
// fact that says where to walk (2026-10-07: it was a tag styled like the Accept button beside it).
function addSource(s) {
  if (s.pullFrom && s.pullFrom.deck) return `<div class="swap-src" style="color:var(--mtg);">↑ from ${esc(s.pullFrom.deck)}</div>`;
  if (s.boxLocation) return `<div class="swap-src">${ic('box', 13)} from ${esc(s.boxLocation)}</div>`;
  return '';
}
// Where the cut card goes, under the cut.
function removeDest(s) {
  if (s.linkedTo && s.linkedTo.deck) return `<div class="swap-src ret" style="color:var(--info);">↓ to ${esc(s.linkedTo.deck)}</div>`;
  if (s.synthetic && String(s.add || '').startsWith('[Find replacement')) return `<div class="swap-src ret" style="color:var(--info);">replacement</div>`;
  if (s.removeBoxLocation) return `<div class="swap-src ret">↩ return to ${esc(s.removeBoxLocation)}</div>`;
  return '';
}
// Shared by the per-deck swap sheet and the Plan → Swap Order tab:
//   + incoming card   (pips) (check shelf) (state)        kind
//       from box / from deck
//   − outgoing card   (pips)
//       return to box / to deck
function swapLineHtml(s) {
  const removeReal = s.remove && s.remove !== '[OPEN SLOT]';
  const pips = Array.isArray(s.colors) ? pipsHtml(s.colors) : '';  // [] = colourless, shows {C}
  const state = s.applied ? `<span class="tag ok">${s.physicallyDone ? 'done' : 'to move'}</span>` : '';
  // Last free copy per the collection (app: MtgRoles.lastCopyAdds): confirm it on the shelf.
  const shelf = (s.lastCopy && !s.applied) ? `<span class="tag" style="color:var(--mtg);">check shelf</span>` : '';

const DQ_KEY = 'dv_decisions';

// Drop synced decisions the desktop has already processed. A decision only matters while its swap
// is still pending in the current export (accept/skip: not applied yet; markMoved: applied, not yet
// moved). Without this the queue kept every tap forever and each push re-uploaded the whole history,
// so the desktop re-read months-old decisions (2026-09-26: 31 of 56 inbox decisions were from June
// and July; an old accept/skip could re-fire if the same swap were ever queued again).
function dqPrune() {
  const live = {};
  for (const d of (DATA && DATA.mtg) || []) for (const s of d.swaps || []) live[s.sid] = s;
  const q = dqLoad(); let changed = false;
  for (const [sid, dec] of Object.entries(q)) {
    const s = live[sid];
    const pending = !!s && (dec.action === 'markMoved' ? (s.applied && !s.physicallyDone) : !s.applied);
    if (dec.synced && !pending) { delete q[sid]; changed = true; }
  }

}

let _pushing = false, _pushAgain = false;
async function pushDecisions() {
  const gh = DATA.gh;
  if (!gh || !gh.token) return;            // GitHub not configured → decisions stay local (pending)
  if (_pushing) { _pushAgain = true; return; }
  _pushing = true;
  try {
    const url = `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/inbox/decisions.json`;
    const headers = { Authorization: `Bearer ${gh.token}`, Accept: 'application/vnd.github+json' };
    let sha;
    try { const r = await fetch(`${url}?ref=${gh.branch}&t=${Date.now()}`, { headers, cache: 'no-store' }); if (r.ok) sha = (await r.json()).sha; } catch {}
    dqPrune();
    const decisions = Object.values(dqLoad());
    const content = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, decisions }, null, 2))));
    const body = { message: `phone decisions (${decisions.length})`, content, branch: gh.branch, ...(sha ? { sha } : {}) };
    const put = await fetch(url, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!put.ok) throw new Error('github write failed: ' + put.status);
    const sent = new Set(decisions.map(d => d.sid));
    const nq = dqLoad(); for (const k of Object.keys(nq)) if (sent.has(k)) nq[k].synced = true; dqSave(nq);
  } finally {
    _pushing = false;

  }
}
function flushDecisions() { dqPrune(); if (Object.values(dqLoad()).some(d => !d.synced)) pushDecisions().catch(() => {}); }

// ── Deck printings (temporary capture mode) ──
// Each physical deck's non-basic cards owned in 2+ printings (d.printQ, built by the exporter with
// mtg-printings.js). Flip mode (2026-10-03): Jake holds the shuffled deck, types the first letters of
// the top card and taps the picture of the printing in his hand; a card that doesn't come up is
// already known. List mode shows every question. A printing whose copies other decks already hold
// can't be in this deck: when one printing is left the phone fills it in (auto) and syncs it like a
// pick. Picks queue locally (dv_printings) and go to inbox/printings.json; the desktop's Sync from
// Phone saves them to deck-meta `printings`.
const PQ_KEY = 'dv_printings';
function pqLoad() { try { return JSON.parse(localStorage.getItem(PQ_KEY) || '{}'); } catch { return {}; } }

function pqAnswer(d, q, Q) { const e = (Q || pqLoad())[pqDeckKey(d) + '|' + q.key]; return e ? e.keys : (q.answer || []); }

// Copies of this card other decks hold, by printing: the export's counts moved by this phone's picks
// for other decks that the export doesn't carry yet.
function pqOthers(d, q, Q) {
  const out = {};
  for (const o of q.options) out[o.key] = o.others || 0;
  const self = pqDeckKey(d);
  for (const x of DATA.mtg) {
    const xk = pqDeckKey(x);
    if (xk === self) continue;
    const xq = (x.printQ || []).find(y => y.key === q.key);
    const e = xq && Q[xk + '|' + q.key];
    if (!e) continue;
    for (const k of xq.answer || []) if (k in out) out[k]--;
    for (const k of e.keys) if (k in out) out[k]++;

  return out;
}
// Printings this deck's copy can still be: owned copies other decks don't hold. If that leaves none
// (the collection count is off), every owned printing stays possible and the sheet says so.
function pqPossible(d, q, Q) {
  const held = pqOthers(d, q, Q);
  const opts = q.options.map(o => ({ ...o, left: o.own - (held[o.key] || 0) }));
  const ok = opts.filter(o => o.left > 0);
  return { opts, possible: ok.length ? ok : opts, conflict: !ok.length };
}
// Fill in every unanswered card whose printing is the only one left, across all decks, until nothing
// changes (an answer in one deck can settle another). Returns how many it filled.
function pqDeduceAll() {
  const Q = pqLoad();
  let total = 0, changed = false;
  // A filled-in answer stands only while it is still the one printing left: a pick changed in
  // another deck withdraws it (and clears it on the desktop if it already went there).
  for (const [id, e] of Object.entries(Q)) {
    if (!e.auto) continue;
    const d = ((DATA && DATA.mtg) || []).find(x => pqDeckKey(x) === e.deckKey);
    const q = d && (d.printQ || []).find(x => x.key === e.key);
    const p = q && pqPossible(d, q, Q);
    if (p && !p.conflict && p.possible.length === 1 && p.possible[0].key === e.keys[0]) continue;
    if (q && pqSame(q.answer, e.keys)) Q[id] = { ...e, keys: [], auto: false, synced: false, ts: Date.now() };
    else delete Q[id];
    changed = true;
  }
  for (let pass = 0; pass < 6; pass++) {
    let n = 0;
    for (const d of (DATA && DATA.mtg) || []) for (const q of d.printQ || []) {
      if (pqAnswer(d, q, Q).length) continue;
      const { possible, conflict } = pqPossible(d, q, Q);
      if (conflict || possible.length !== 1 || possible[0].left < q.qty) continue;
      Q[pqDeckKey(d) + '|' + q.key] = { deckKey: pqDeckKey(d), key: q.key, name: q.name, keys: Array(q.qty).fill(possible[0].key), ts: Date.now(), synced: false, auto: true };
      n++;

}

function printBtnText(d) { const n = printLeft(d); return n ? `Printings · ${n} left` : 'Printings · done'; }
// Drop synced picks the export already carries (or whose question is gone), so the queue doesn't
// re-send old answers forever (the dqPrune lesson).
function pqPrune() {

  for (const [id, e] of Object.entries(q)) {

    const qq = d && (d.printQ || []).find(x => x.key === e.key);

// ── Minimal markdown → HTML (offline, no deps) ──
function mdToHtml(md) {
  const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
  let html = '', inUl = false, inOl = false, inCode = false, para = [], table = null;
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const flushP = () => { if (para.length) { html += '<p>' + inline(para.join(' ')) + '</p>'; para = []; } };
  const flushUl = () => { if (inUl) { html += '</ul>'; inUl = false; } };
  const flushOl = () => { if (inOl) { html += '</ol>'; inOl = false; } };
  // Tables: header row, |---| separator, body rows (added for the MTG Deck Building Guide).
  const flushT = () => { if (table) { html += '<table><thead><tr>' + table.head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + table.rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>'; table = null; } };
  const flushAll = () => { flushP(); flushUl(); flushOl(); flushT(); };
  const cells = l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  for (const raw of lines) {
    const tl = raw.trim();
    if (!inCode && /^\|.*\|$/.test(tl)) {
      if (!table) { flushP(); flushUl(); flushOl(); table = { head: cells(tl), rows: [] }; }
      else if (!/^\|[\s\-|:]+\|$/.test(tl)) table.rows.push(cells(tl));
      continue;
    }
    flushT();
    if (/^```/.test(raw.trim())) { if (inCode) { html += '</pre>'; inCode = false; } else { flushAll(); html += '<pre>'; inCode = true; } continue; }
    if (inCode) { html += esc(raw) + '\n'; continue; }
    const line = raw.trim();
    if (!line) { flushAll(); continue; }
    let m;
    if (m = line.match(/^(#{1,6})\s+(.*)$/)) { flushAll(); const lv = Math.min(m[1].length, 4); const id = m[2].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); html += `<h${lv} id="${id}">${inline(m[2])}</h${lv}>`; continue; }
    if (/^(---|\*\*\*|___)$/.test(line)) { flushAll(); html += '<hr>'; continue; }
    if (m = line.match(/^[-*+]\s+(.*)$/)) { flushP(); flushOl(); if (!inUl) { html += '<ul>'; inUl = true; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (m = line.match(/^\d+[.)]\s+(.*)$/)) { flushP(); flushUl(); if (!inOl) { html += '<ol>'; inOl = true; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (m = line.match(/^>\s?(.*)$/)) { flushAll(); html += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
    para.push(line);
  }
  flushAll(); if (inCode) html += '</pre>';
  return html;
}

// Pure recognizer math for the Little Troubles scanner. No DOM, no fetch — so it
// runs in Node (build + tests) AND is injected verbatim into the mobile template.
// dHash grid is (CELL_W+1) x CELL_H grayscale => CELL_W*CELL_H comparison bits.
const CELL_W = 8;   // comparison columns (grid is 9 wide)
const CELL_H = 8;

// dHash from a grayscale array of size (CELL_W+1)*CELL_H, row-major.
// bit index = r*CELL_W + c ; bit set when gray[r][c] > gray[r][c+1].
function dhashFromGray(gray, w, h) {
  let hash = 0n;
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w - 1; c++) {
      const i = r * w + c;
      if (gray[i] > gray[i + 1]) hash |= 1n << BigInt(r * (w - 1) + c);
    }
  }
  return hash;
}

// Banner mask: physical cards lack the wiki's top-left diagonal ribbon, so we
// drop bits whose cell center lies in the top-left triangle
// (0,0)->(0.38W,0)->(0,0.26H): x/0.38 + y/0.26 <= 1.
function _computeMaskedBits() {
  const s = new Set();
  for (let r = 0; r < CELL_H; r++) {
    for (let c = 0; c < CELL_W; c++) {
      const x = (c + 0.5) / CELL_W, y = (r + 0.5) / CELL_H;
      if (x / 0.38 + y / 0.26 <= 1) s.add(r * CELL_W + c);
    }
  }
  return s;
}
const MASKED_BITS = _computeMaskedBits();
const _MASK = (() => { let m = 0n; for (const b of MASKED_BITS) m |= 1n << BigInt(b); return ~m; })();

function firstFreeBit() { for (let b = 0; b < CELL_W * CELL_H; b++) if (!MASKED_BITS.has(b)) return b; return -1; }
function firstMaskedBit() { return MASKED_BITS.values().next().value; }

// Hamming distance over non-masked bits only.
function maskedHamming(a, b) {
  let x = (a ^ b) & _MASK, n = 0;
  while (x > 0n) { n += Number(x & 1n); x >>= 1n; }
  return n;
}

// Nearest entry in the reference table. Returns {best, second} each {id, face, distance}.
function nearestMatch(hash, table) {
  let best = null, second = null;
  for (const e of table) {
    const d = maskedHamming(hash, e.hash);
    const hit = { id: e.id, face: e.face, distance: d };
    if (!best || d < best.distance) { second = best; best = hit; }
    else if (!second || d < second.distance) second = hit;
  }
  return { best, second };
}

// Normalize a card name for matching: lowercase, drop the dual-face " // " tail,
// strip surrounding quotes and punctuation, collapse whitespace.
// Assumption: catalog names use " // " exclusively as the dual-face separator
// (not as literal card-name punctuation). Stripping all punctuation will not
// cause false collisions within the current 558-card LT pool because no two
// cards are punctuation-distinct on the same normalized token sequence.
function normalizeName(name) {
  if (!name) return '';
  let s = String(name).split('//')[0];           // front face only
  s = s.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  return s;
}

// Resolve a read (name + optional collector number/total) to one catalog card.
// Name is primary; number/total disambiguates same-name reprints across sets.
function resolveByNameNumber(name, number, total, catalog) {
  const want = normalizeName(name);
  if (!want) return null;
  const matches = catalog.filter(c => normalizeName(c.name) === want);
  if (matches.length === 0) return null;
  if (matches.length === 1) return matches[0];
  if (number != null) {
    const byNum = matches.filter(c => Number(c.number) === Number(number) &&
      (total == null || Number(c.setSize) === Number(total)));
    if (byNum.length === 1) return byNum[0];
    if (byNum.length === 0) return null;   // number given but matched nothing → don't guess; let the review UI handle it
    // byNum.length > 1 → fall through to first-match
  }
  return matches[0]; // best effort when no number to disambiguate; review UI lets the user correct
}

// True if a proposed new-deck name collides with an existing deck (case-insensitive).
function deckNameCollision(name, decks) {
  const n = String(name || '').trim().toLowerCase();
  return (decks || []).some(d => String(d.name || '').trim().toLowerCase() === n);
}

// ── Standalone Little Troubles app: merging a save from two devices ─────────────
// The app keeps its collection and decks in one file. Before saving, a device fetches the file
// again and applies only what IT changed since it last synced (local minus base) on top of what
// is there now (remote), so a card scanned on the phone is not lost to an edit made on the PC.
// Quantities: remote + (local - base), never below zero; a card at zero is dropped.

  const out = {};
  for (const id of new Set([...Object.keys(remote || {}), ...Object.keys(base || {}), ...Object.keys(local || {})])) {
    const q = ((remote || {})[id] || 0) + (((local || {})[id] || 0) - ((base || {})[id] || 0));
    if (q > 0) out[id] = q;
  }

}

  if (q) cards = ltCat().cards.filter(c => _ltMatch(c.name + ' ' + (c.text || ''), q));
  else cards = ltCat().cards.filter(c => ltOwnedMode(c.id) > 0);
  const rows = cards.slice(0, 150).map(c => {
    const qty = ltOwnedMode(c.id);
    return `<div class="lt-row">

}

// Reattach an already-running stream across re-renders. The camera is started
// explicitly via ltStartCamera() (a direct tap) — iOS standalone PWAs often block
// an auto-started camera but allow one initiated by a user gesture.
function ltScanMount() {
  if (!_ltStream) return;
  const v = document.getElementById('lt-cam'); if (v) v.srcObject = _ltStream;
}

// Start the live camera on an explicit user tap; surface the real reason on failure.
async function ltStartCamera() {
  const status = document.getElementById('lt-scan-status');
  const startBtn = document.getElementById('lt-cam-start');
  if (status) status.textContent = 'Starting camera…';
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('getUserMedia unavailable');
    _ltStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const v = document.getElementById('lt-cam'); if (v) v.srcObject = _ltStream;
    if (startBtn) startBtn.hidden = true;
    const sh = document.getElementById('lt-shutter'); if (sh) sh.disabled = false;
    if (status) status.textContent = '';
  } catch (e) {
    console.warn('LT camera unavailable:', e);
    const reason = (e && e.name && e.name !== 'Error') ? e.name : (e && e.message ? e.message : 'error');
    if (status) status.textContent = 'Camera blocked (' + reason + ') — iOS may not allow live camera in a home-screen app. Use Photo, or open the site in Safari.';
    if (startBtn) startBtn.textContent = 'Tap to retry camera';
  }
}
function ltScanUnmount() {
  if (_ltStream) { _ltStream.getTracks().forEach(t => t.stop()); _ltStream = null; }
}

function ltBatchHtml() {
